  function normalize(value) {
    return String(value || '').replace(/\s+/g, ' ').trim();
  }

  function isEnhancerNode(node) {
    if (!node || node.nodeType !== 1) return false;
    if (typeof node.id === 'string' && node.id.startsWith('cliproxy-')) return true;
    return Array.from(node.classList || []).some((className) => String(className || '').startsWith('cliproxy-'));
  }

  function escapeHTML(value) {
    return String(value == null ? '' : value).replace(/[&<>\"]/g, (char) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;'
    }[char]));
  }

  function parseJSONStorage(key, fallback) {
    try {
      const raw = window.localStorage.getItem(key);
      if (raw == null || raw === '') return fallback;
      return JSON.parse(raw);
    } catch {
      return fallback;
    }
  }

  function setJSONStorage(key, value) {
    try {
      window.localStorage.setItem(key, JSON.stringify(value));
    } catch {}
  }

  function getBoolSetting(key, fallback) {
    const value = parseJSONStorage(key, fallback);
    return typeof value === 'boolean' ? value : fallback;
  }

  function getIntSetting(key, fallback, min, max) {
    const value = Number(parseJSONStorage(key, fallback));
    if (!Number.isFinite(value)) return fallback;
    return Math.min(max, Math.max(min, Math.round(value)));
  }

  function getUsageAutoEnabled() {
    return getBoolSetting(STORAGE_KEYS.usageAuto, true);
  }

  function getUsageIntervalSeconds() {
    return getIntSetting(STORAGE_KEYS.usageInterval, DEFAULT_USAGE_INTERVAL, 1, 60);
  }

  function getQuotaAutoEnabled() {
    return getBoolSetting(STORAGE_KEYS.quotaAuto, false);
  }

  function getQuotaIntervalSeconds() {
    return getIntSetting(STORAGE_KEYS.quotaInterval, DEFAULT_QUOTA_INTERVAL, 1, 300);
  }

  function getQuotaPageSize() {
    return getIntSetting(STORAGE_KEYS.quotaPageSize, DEFAULT_QUOTA_PAGE_SIZE, 1, 1000);
  }

  function getMain() {
    return document.querySelector('main');
  }

  function getPageLayer() {
    const main = getMain();
    if (!main) return null;
    return main.querySelector('.page-transition__layer') || main.firstElementChild;
  }

  function getPageContainer() {
    const layer = getPageLayer();
    if (!layer) return null;
    return layer.firstElementChild || layer;
  }

  function getPageTitle() {
    const container = getPageContainer();
    const heading = container ? container.querySelector('h1') : null;
    return normalize(heading ? heading.textContent : '');
  }

  function isUsageRoute() {
    return window.location.hash.startsWith('#/usage');
  }

  function isQuotaRoute() {
    return window.location.hash.startsWith('#/quota');
  }

  function isUsagePageReady() {
    return isUsageRoute() && getPageTitle() === 'Usage Statistics';
  }

  function isQuotaPageReady() {
    return isQuotaRoute() && getPageTitle() === 'Quota Management';
  }

  function isAIProvidersConfigPageReady() {
    return getPageTitle() === 'AI Providers Configuration';
  }

  function currentRouteKey() {
    const hash = normalize(window.location.hash || '');
    return hash || normalize(window.location.pathname || '');
  }

  function sameOriginManagementURL(input) {
    try {
      const url = new URL(input, window.location.origin);
      return url.origin === window.location.origin && url.pathname.startsWith('/v0/management/');
    } catch {
      return false;
    }
  }

  function getHeaderValue(headers, name) {
    if (!headers) return '';
    const lowerName = name.toLowerCase();
    if (headers instanceof Headers) return headers.get(name) || headers.get(lowerName) || '';
    if (Array.isArray(headers)) {
      const match = headers.find((entry) => String(entry && entry[0] || '').toLowerCase() === lowerName);
      return match ? String(match[1] || '') : '';
    }
    if (typeof headers === 'object') {
      for (const key of Object.keys(headers)) {
        if (key.toLowerCase() === lowerName) return String(headers[key] || '');
      }
    }
    return '';
  }

  function decodeStoredAuthValue(value) {
    if (!value) return '';
    const prefix = 'enc::v1::';
    if (!String(value).startsWith(prefix)) return String(value);
    try {
      const host = window.location.host;
      const userAgent = navigator.userAgent;
      const keySource = `cli-proxy-api-webui::secure-storage|${host}|${userAgent}`;
      const keyBytes = new TextEncoder().encode(keySource);
      const encoded = String(value).slice(prefix.length);
      const raw = atob(encoded);
      const data = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i += 1) data[i] = raw.charCodeAt(i);
      for (let i = 0; i < data.length; i += 1) data[i] = data[i] ^ keyBytes[i % keyBytes.length];
      return new TextDecoder().decode(data);
    } catch {
      return '';
    }
  }

  function readStoredJSONValue(key) {
    try {
      const raw = window.localStorage.getItem(key);
      if (!raw) return null;
      const decoded = decodeStoredAuthValue(raw);
      return JSON.parse(decoded);
    } catch {
      return null;
    }
  }

  function readStoredStringValue(key) {
    const parsed = readStoredJSONValue(key);
    if (typeof parsed === 'string') return parsed.trim();
    return '';
  }

  function writeSessionManagementKey(authKey) {
    try {
      const value = String(authKey || '').trim();
      if (!value) {
        window.sessionStorage.removeItem(SESSION_AUTH_STORAGE_KEY);
        return;
      }
      window.sessionStorage.setItem('cliproxy-management-key-v1', JSON.stringify(value));
    } catch {}
  }

  function readSessionManagementKey() {
    try {
      const raw = window.sessionStorage.getItem(SESSION_AUTH_STORAGE_KEY);
      if (!raw) return '';
      const parsed = JSON.parse(raw);
      return typeof parsed === 'string' ? parsed.trim() : '';
    } catch {
      return '';
    }
  }

  function readStoredManagementAuthorization() {
    const authKey = readSessionManagementKey() || readStoredStringValue(AUTH_STORAGE_KEY);
    if (!authKey) return '';
    return `Bearer ${authKey}`;
  }

  function captureManagementAuthFromLoginPage() {
    const input = document.querySelector('input[type="password"], input[name="managementKey"], input[id="managementKey"]');
    if (!(input instanceof HTMLInputElement)) return;
    const persist = () => {
      const value = String(input.value || '').trim();
      if (!value) return;
      writeSessionManagementKey(value);
      managementAuthorization = `Bearer ${value}`;
    };
    if (input.dataset.cliproxyCaptureInstalled !== 'true') {
      input.dataset.cliproxyCaptureInstalled = 'true';
      input.addEventListener('input', persist);
      input.addEventListener('change', persist);
    }
    const form = input.form || input.closest('form');
    if (form instanceof HTMLFormElement && form.dataset.cliproxyCaptureInstalled !== 'true') {
      form.dataset.cliproxyCaptureInstalled = 'true';
      form.addEventListener('submit', persist);
    }
    persist();
  }

  function captureManagementAuthorization(urlLike, headers) {
    if (!sameOriginManagementURL(urlLike)) return;
    const auth = getHeaderValue(headers, 'authorization');
    if (auth && auth.startsWith('Bearer ')) {
      managementAuthorization = auth;
      writeSessionManagementKey(auth.slice('Bearer '.length));
    }
  }

  function getUsageProviderFilter() {
    const select = document.querySelector('#cliproxy-usage-provider-filter');
    if (!(select instanceof HTMLSelectElement)) return '';
    return String(select.value || '').trim();
  }

  function isNativeUsageRequestURL(urlLike) {
    try {
      const url = new URL(urlLike, window.location.origin);
      return url.origin === window.location.origin && url.pathname === '/v0/management/usage';
    } catch {
      return false;
    }
  }

  function appendUsageProviderFilter(urlLike) {
    try {
      const url = new URL(urlLike, window.location.origin);
      if (!isUsageRoute() || url.origin !== window.location.origin || url.pathname !== '/v0/management/usage') {
        return urlLike;
      }
      const provider = getUsageProviderFilter();
      if (provider) {
        url.searchParams.set('provider', provider);
      } else {
        url.searchParams.delete('provider');
      }
      return url.toString();
    } catch {
      return urlLike;
    }
  }

  function patchFetch() {
    if (!nativeFetch) return;
    window.fetch = async function patchedFetch(input, init) {
      let nextInput = input;
      let shouldRepatchUsage = false;
      let usageURL = '';
      try {
        const originalURL = typeof input === 'string' ? input : (input && input.url) || '';
        const rewrittenURL = appendUsageProviderFilter(originalURL);
        shouldRepatchUsage = isNativeUsageRequestURL(rewrittenURL || originalURL);
        usageURL = rewrittenURL || originalURL;
        if (typeof Request !== 'undefined' && input instanceof Request) {
          if (rewrittenURL && rewrittenURL !== input.url) {
            nextInput = new Request(rewrittenURL, input);
          }
          captureManagementAuthorization(nextInput.url, nextInput.headers);
        } else {
          if (typeof input === 'string') {
            nextInput = rewrittenURL;
          }
          captureManagementAuthorization(
            rewrittenURL,
            (init && init.headers) || (input && input.headers) || null,
          );
        }
      } catch {}
      const response = await nativeFetch(nextInput, init);
      if (shouldRepatchUsage) {
        await captureNativeUsageSnapshotFromResponse(response, usageURL);
        scheduleUsagePatchAfterNativeRefresh(0);
      }
      return response;
    };

  function patchXHR() {
    if (!window.XMLHttpRequest) return;
    const open = XMLHttpRequest.prototype.open;
    const setRequestHeader = XMLHttpRequest.prototype.setRequestHeader;
    XMLHttpRequest.prototype.open = function patchedOpen(method, url) {
      const rewrittenURL = appendUsageProviderFilter(url);
      this.__cliproxyURL = rewrittenURL;
      this.__cliproxyHeaders = {};
      if (isNativeUsageRequestURL(rewrittenURL)) {
        this.addEventListener('loadend', () => {
          scheduleUsagePatchAfterNativeRefresh(0);
        }, { once: true });
      }
      const args = Array.from(arguments);
      args[1] = rewrittenURL;
      return open.apply(this, args);
    };
    XMLHttpRequest.prototype.setRequestHeader = function patchedSetRequestHeader(name, value) {
      try {
        if (!this.__cliproxyHeaders) this.__cliproxyHeaders = {};

        captureManagementAuthorization(this.__cliproxyURL || '', this.__cliproxyHeaders);
      } catch {}
      return setRequestHeader.apply(this, arguments);
    };
  }

  function wait(ms) {
    return new Promise((resolve) => window.setTimeout(resolve, ms));
  }

  function triggerUsageRefresh() {
    const container = getPageContainer();
    if (!container) return false;
    const button = Array.from(container.querySelectorAll('button')).find((el) => normalize(el.textContent) === 'Refresh');
    if (!button || button.disabled) return false;
    button.click();
    return true;
  }

  function scheduleNativeUsageRefreshRetry(delayMs) {
    if (nativeUsageRefreshRetryTimer) return;
    nativeUsageRefreshRetryTimer = window.setTimeout(() => {
      nativeUsageRefreshRetryTimer = null;
      if (!isUsagePageReady() || document.hidden) return;
      triggerNativeUsageRefresh(true);
    }, Math.max(0, delayMs));
  }

  function scheduleUsagePatchAfterNativeRefresh(delayMs) {
    window.setTimeout(() => {
      if (!isUsagePageReady() || document.hidden) return;
      refreshUsagePage(false).catch(() => {});
    }, Math.max(0, delayMs));
  }

  function clearUsageFilterSyncTimer() {
    if (!usageFilterSyncTimer) return;
    window.clearTimeout(usageFilterSyncTimer);
    usageFilterSyncTimer = null;
  }

  function invalidateUsageRefreshState() {
    lastUsageStatisticsFetchAt = 0;
    lastUsageStatistics = null;
    lastUsageStatisticsRangeKey = '';
    lastUsageStatisticsProvider = '';
    lastNativeUsageSnapshot = null;
    lastNativeUsageSnapshotProvider = '';
    lastNativeUsageRefreshAt = 0;
    lastNativeUsageRefreshKey = '';
  }

  function getUsageFilterKey() {
    const timeRange = getUsageTimeRange();
    const provider = getUsageProviderFilter();
    return `${timeRange.key}:${provider}`;
  }

  function captureNativeUsageSnapshotPayload(payload, urlLike) {
    const snapshot = payload && payload.usage && typeof payload.usage === 'object' ? payload.usage : null;
    if (!snapshot) return false;
    lastNativeUsageSnapshot = snapshot;
    try {
      const url = new URL(urlLike, window.location.origin);
      lastNativeUsageSnapshotProvider = normalize(url.searchParams.get('provider'));
    } catch {
      lastNativeUsageSnapshotProvider = getUsageProviderFilter();
    }
    return true;
  }

  async function captureNativeUsageSnapshotFromResponse(response, urlLike) {
    if (!response || typeof response.clone !== 'function' || !response.ok) return false;
    try {
      const payload = await response.clone().json();
      return captureNativeUsageSnapshotPayload(payload, urlLike);
    } catch {
      return false;
    }
  }

  function scheduleUsageFilterSync(delayMs, options = {}) {
    clearUsageFilterSyncTimer();
    usageFilterSyncTimer = window.setTimeout(() => {
      usageFilterSyncTimer = null;
      if (!isUsagePageReady() || document.hidden) return;
      const nextKey = getUsageFilterKey();
      if (!options.force && nextKey === lastObservedUsageFilterKey) return;
      lastObservedUsageFilterKey = nextKey;
      invalidateUsageRefreshState();
      if (options.triggerNativeRefresh) {
        triggerNativeUsageRefresh(false);
      }
      refreshUsagePage(false).catch(() => {});
    }, Math.max(0, delayMs));
  }

  function triggerNativeUsageRefresh(background) {
    if (!isUsagePageReady()) return false;
    const key = getUsageFilterKey();
    const minIntervalMs = getUsageIntervalSeconds() * 1000;
    const elapsedMs = Date.now() - lastNativeUsageRefreshAt;
    if (background && lastNativeUsageRefreshAt > 0 && lastNativeUsageRefreshKey === key && elapsedMs < minIntervalMs) {
      scheduleNativeUsageRefreshRetry(minIntervalMs - elapsedMs);
      return false;
    }
    const triggered = triggerUsageRefresh();
    if (triggered) {
      lastNativeUsageRefreshAt = Date.now();
      lastNativeUsageRefreshKey = key;
      scheduleUsagePatchAfterNativeRefresh(background ? 500 : 250);
    } else if (background) {
      scheduleNativeUsageRefreshRetry(750);
    }
    return triggered;
  }

  function triggerQuotaRefreshAll() {
    const container = getPageContainer();
    if (!container) return false;
    const buttons = Array.from(container.querySelectorAll('button')).filter((el) => normalize(el.textContent) === 'Refresh all credentials' && !el.disabled);
    if (!buttons.length) return false;
    buttons.forEach((button) => button.click());
    return true;
  }

  async function ensureManagementAuth() {
    captureManagementAuthFromLoginPage();
    if (!managementAuthorization) {
      managementAuthorization = readStoredManagementAuthorization();
    }
    if (managementAuthorization) return true;
    if (authPrimePromise) return authPrimePromise;
    authPrimePromise = (async () => {
      if (isUsagePageReady()) {
        triggerUsageRefresh();
      } else if (isQuotaPageReady()) {
        const container = getPageContainer();
        const refreshButton = container ? container.querySelector('button[aria-label="Refresh all credentials"]') : null;
        if (refreshButton && !refreshButton.disabled) refreshButton.click();
      }
      const deadline = Date.now() + 3000;
      while (!managementAuthorization && Date.now() < deadline) {
        captureManagementAuthFromLoginPage();
        managementAuthorization = readStoredManagementAuthorization() || managementAuthorization;
        if (managementAuthorization) break;
        await wait(100);
      }
      return !!managementAuthorization;
    })().finally(() => {
      authPrimePromise = null;
    });
    return authPrimePromise;
  }

  function readUsageTimeRangeValue(container) {
    if (!container) return '';
    const rangeButton = container.querySelector('button[aria-label="Time Range"]') || Array.from(container.querySelectorAll('button')).find((el) => {
      const text = normalize(el.textContent);
      return text === 'All Time' || text === 'Last 7 Hours' || text === 'Last 24 Hours' || text === 'Last 7 Days';
    });
    return normalize(rangeButton ? rangeButton.textContent : '');
  }

  function getUsageTimeRange() {
    const container = getPageContainer();
    let value = readUsageTimeRangeValue(container);
    if (value) {
      setJSONStorage(TIME_RANGE_KEY, value);
    } else {
      value = parseJSONStorage(TIME_RANGE_KEY, 'Last 24 Hours');
    }
    value = normalize(value).toLowerCase();
    if (value === '7h' || value === 'last 7 hours') {
      return { key: '7h', label: 'Last 7 Hours', days: 1, cutoffMs: 7 * 60 * 60 * 1000, since: new Date(Date.now() - 7 * 60 * 60 * 1000).toISOString() };
    }
    if (value === '7d' || value === 'last 7 days') {
      return { key: '7d', label: 'Last 7 Days', days: 7, cutoffMs: 7 * 24 * 60 * 60 * 1000, since: new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString() };
    }
    if (value === 'all' || value === 'all time') {
      return { key: 'all', label: 'All Time', days: 3650, cutoffMs: null, since: '' };
    }
    return { key: '24h', label: 'Last 24 Hours', days: 1, cutoffMs: 24 * 60 * 60 * 1000, since: new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString() };
  }

  async function fetchCacheStatistics(timeRange, limit) {
    const ready = await ensureManagementAuth();
    if (!ready || !nativeFetch || !managementAuthorization) return null;
    const url = new URL('/v0/management/cache-statistics', window.location.origin);
    if (timeRange && timeRange.since) {
      url.searchParams.set('since', String(timeRange.since));
    } else {
      url.searchParams.set('days', String(timeRange && timeRange.days || 14));
    }
    const provider = getUsageProviderFilter();
    if (provider) {
      url.searchParams.set('provider', provider);
    }
    url.searchParams.set('limit', String(limit));
    url.searchParams.set('model_limit', String(MODEL_LIMIT));
    const response = await nativeFetch(url.toString(), {
      headers: { Authorization: managementAuthorization },
    });
    if (!response.ok) return null;
    const payload = await response.json();
    return payload && payload.cache_statistics ? payload.cache_statistics : null;
  }

  async function fetchOpenAICompatProviders() {
    const ready = await ensureManagementAuth();
    if (!ready || !nativeFetch || !managementAuthorization) return [];
    const response = await nativeFetch(new URL('/v0/management/openai-compatibility', window.location.origin).toString(), {
      headers: { Authorization: managementAuthorization },
    });
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    const payload = await response.json();
    return Array.isArray(payload && payload['openai-compatibility']) ? payload['openai-compatibility'] : [];
  }

  async function patchOpenAICompatProviderConfig(name, value) {
    const ready = await ensureManagementAuth();
    if (!ready || !nativeFetch || !managementAuthorization) {
      throw new Error('Management authorization unavailable');
    }
    const response = await nativeFetch(new URL('/v0/management/openai-compatibility', window.location.origin).toString(), {
      method: 'PATCH',
      headers: {
        Authorization: managementAuthorization,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        name,
        value,
      }),
    });
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
  }

  function formatInteger(value) {
    return new Intl.NumberFormat().format(Number(value || 0));
  }

  function formatCompact(value) {
    return new Intl.NumberFormat(undefined, { notation: 'compact', maximumFractionDigits: 1 }).format(Number(value || 0));
  }

  function formatCurrency(value) {
    const amount = Number(value);
    if (!Number.isFinite(amount)) return '$0.00';
    const rounded = amount.toFixed(2);
    return `$${Number(rounded).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  }

  function formatDateTime(value) {
    if (!value) return '';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return '';
    return date.toLocaleString();
  }

  function formatDurationMs(value) {
    const ms = Number(value || 0);
    if (!Number.isFinite(ms) || ms <= 0) return 'n/a';
    if (ms < 1000) return `${Math.round(ms)} ms`;
    const seconds = ms / 1000;
    if (seconds < 10) return `${seconds.toFixed(2)} s`;
    if (seconds < 60) return `${seconds.toFixed(1)} s`;
    const minutes = Math.floor(seconds / 60);
    const remainingSeconds = seconds - (minutes * 60);
    return `${minutes}m ${remainingSeconds.toFixed(0)}s`;
  }

  function trendSeriesColors() {
    return [
      '#8b8680',
      '#0f766e',
      '#b45309',
      '#7c3aed',
      '#2563eb',
      '#be185d',
      '#047857',
      '#b91c1c',
      '#4338ca',
      '#0f766e',
    ];
  }

  function findUsageTrendCard(container, title) {
    if (!container) return null;
    return Array.from(container.querySelectorAll('.card')).find((card) => {
      const titleNode = card.querySelector('.title');
      return normalize(titleNode ? titleNode.textContent : '').toLowerCase() === normalize(title).toLowerCase();
    }) || null;
  }

  function getUsageTrendPeriod(card) {
    if (!(card instanceof HTMLElement)) return 'hour';
    const buttons = Array.from(card.querySelectorAll('button'));
    const active = buttons.find((button) => String(button.className || '').includes('btn-primary'));
    const activeLabel = normalize(active ? active.textContent : '');
    return activeLabel === 'By Day' ? 'day' : 'hour';
  }

  function formatTrendBucketLabel(bucket, period) {
    if (!bucket) return '';
    if (period === 'day') {
      const date = new Date(`${bucket}T00:00:00Z`);
      if (Number.isNaN(date.getTime())) return bucket;
      return date.toLocaleDateString(undefined, { month: '2-digit', day: '2-digit' });
    }
    const date = new Date(bucket);
    if (Number.isNaN(date.getTime())) return bucket;
    const month = String(date.getUTCMonth() + 1).padStart(2, '0');
    const day = String(date.getUTCDate()).padStart(2, '0');
    const hour = String(date.getUTCHours()).padStart(2, '0');
    return `${month}-${day} ${hour}:00`;
  }

  function buildUsageTrendSeries(stats, period, metric) {
    const trendByModel = stats && stats.trend_by_model && typeof stats.trend_by_model === 'object'
      ? stats.trend_by_model
      : {};
    const byModel = Array.isArray(stats && stats.by_model) ? stats.by_model : [];
    const orderedModels = [];
    const seen = new Set();
    byModel.forEach((item) => {
      const model = normalize(item && item.model);
      if (!model || seen.has(model)) return;
      seen.add(model);
      orderedModels.push(model);
    });
    Object.keys(trendByModel).sort().forEach((model) => {
      const normalized = normalize(model);
      if (!normalized || seen.has(normalized)) return;
      seen.add(normalized);
      orderedModels.push(normalized);
    });
    const bucketKey = period === 'day'
      ? (metric === 'tokens' ? 'tokens_by_day' : 'requests_by_day')
      : (metric === 'tokens' ? 'tokens_by_hour' : 'requests_by_hour');
    const buckets = new Set();
    orderedModels.forEach((model) => {
      const series = trendByModel[model] && trendByModel[model][bucketKey];
      if (!series || typeof series !== 'object') return;
      Object.keys(series).forEach((bucket) => buckets.add(bucket));
    });
    const labels = Array.from(buckets).sort();
    const colors = trendSeriesColors();
    const datasets = orderedModels.map((model, index) => {
      const valuesByBucket = trendByModel[model] && trendByModel[model][bucketKey] && typeof trendByModel[model][bucketKey] === 'object'
        ? trendByModel[model][bucketKey]
        : {};
      const values = labels.map((bucket) => Math.max(0, Number(valuesByBucket[bucket] || 0)));
      return {
        label: model,
        color: colors[index % colors.length],
        values,
      };
    }).filter((dataset) => dataset.values.some((value) => value > 0));
    return { labels, datasets };
  }

  function buildSeriesChartSVG(labels, datasets, options = {}) {
    if (!labels.length || !datasets.length) {
      return `<div class="cliproxy-enhancer__trend-empty">${escapeHTML(options.emptyMessage || 'No chart data for the selected window.')}</div>`;
    }
    const width = 880;
    const height = 280;
    const padding = { top: 18, right: 18, bottom: 38, left: 52 };
    const innerWidth = width - padding.left - padding.right;
    const innerHeight = height - padding.top - padding.bottom;
    const formatValue = typeof options.valueFormatter === 'function' ? options.valueFormatter : formatCompact;
    const formatLabel = typeof options.labelFormatter === 'function' ? options.labelFormatter : ((label) => label);
    const ariaLabel = normalize(options.ariaLabel || 'Usage chart');
    const allValues = datasets.flatMap((dataset) => dataset.values);
    const maxValue = Math.max(1, ...allValues);
    const gridValues = [0, 0.25, 0.5, 0.75, 1];
    const labelStep = Math.max(1, Math.ceil(labels.length / 6));
    const xForIndex = (index) => {
      if (labels.length <= 1) return padding.left + (innerWidth / 2);
      return padding.left + ((innerWidth * index) / (labels.length - 1));
    };
    const yForValue = (value) => padding.top + innerHeight - ((Math.max(0, value) / maxValue) * innerHeight);
    const gridLines = gridValues.map((ratio) => {
      const y = padding.top + (innerHeight * ratio);
      const value = Math.round(maxValue * (1 - ratio));
      return `
        <line class="cliproxy-enhancer__trend-grid" x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}"></line>
        <text class="cliproxy-enhancer__trend-label" x="${padding.left - 8}" y="${y + 4}" text-anchor="end">${escapeHTML(formatValue(value))}</text>
      `;
    }).join('');
    const xLabels = labels.map((bucket, index) => {
      if (index % labelStep !== 0 && index !== labels.length - 1) return '';
      const x = xForIndex(index);
      return `<text class="cliproxy-enhancer__trend-label" x="${x}" y="${height - 10}" text-anchor="middle">${escapeHTML(formatLabel(bucket, index))}</text>`;
    }).join('');
    const paths = datasets.map((dataset) => {
      const points = dataset.values.map((value, index) => `${xForIndex(index)},${yForValue(value)}`).join(' ');
      const lastIndex = dataset.values.length - 1;
      const lastValue = dataset.values[lastIndex];
      return `
        <polyline fill="none" stroke="${dataset.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${points}"></polyline>
        <circle cx="${xForIndex(lastIndex)}" cy="${yForValue(lastValue)}" r="3.5" fill="${dataset.color}"></circle>
      `;
    }).join('');
    return `
      <div class="cliproxy-enhancer__trend-chart">
        <svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-label="${escapeHTML(ariaLabel)}">
          <line class="cliproxy-enhancer__trend-axis" x1="${padding.left}" y1="${height - padding.bottom}" x2="${width - padding.right}" y2="${height - padding.bottom}"></line>
          <line class="cliproxy-enhancer__trend-axis" x1="${padding.left}" y1="${padding.top}" x2="${padding.left}" y2="${height - padding.bottom}"></line>
          ${gridLines}
          ${paths}
          ${xLabels}
        </svg>
      </div>
    `;
  }

  function buildTrendChartSVG(labels, datasets, metric, period) {
    return buildSeriesChartSVG(labels, datasets, {
      ariaLabel: metric === 'tokens' ? 'Token Usage Trends' : 'Request Trends',
      valueFormatter: metric === 'tokens' ? formatCompact : formatInteger,
      labelFormatter: (bucket) => formatTrendBucketLabel(bucket, period),
    });
  }

  function renderUsageTrendChartCard(card, stats, metric) {
    if (!(card instanceof HTMLElement)) return;
    const nativeWrapper = card.querySelector('[class*="chartWrapper"]');
    if (nativeWrapper instanceof HTMLElement) {
      nativeWrapper.style.display = 'none';
      nativeWrapper.dataset.cliproxyHidden = 'true';
    }
    const metricName = metric === 'tokens' ? 'token-usage-trends' : 'request-trends';
    let panel = card.querySelector(`#cliproxy-${metricName}`);
    if (!panel) {
      panel = document.createElement('div');
      panel.id = `cliproxy-${metricName}`;
      panel.className = 'cliproxy-enhancer__trend-shell';
      if (nativeWrapper && nativeWrapper.parentElement === card) {
        nativeWrapper.insertAdjacentElement('afterend', panel);
      } else {
        card.appendChild(panel);
      }
    }
    const period = getUsageTrendPeriod(card);
    const trend = buildUsageTrendSeries(stats, period, metric);
    const legend = trend.datasets.map((dataset) => `
      <div class="cliproxy-enhancer__trend-legend-item">
        <span class="cliproxy-enhancer__trend-legend-dot" style="background:${dataset.color};"></span>
        <span>${escapeHTML(dataset.label)}</span>
      </div>
    `).join('');
    const signature = [
      metricName,
      period,
      trend.labels.join(','),
      trend.datasets.map((dataset) => `${dataset.label}:${dataset.values.join(',')}`).join('|'),
    ].join(':');

  function supportsOpenAILongContextPricing(modelName) {
    const normalized = normalize(modelName).toLowerCase();
    return normalized === 'gpt-5.4' || normalized === 'gpt-5.4-pro';
  }

  function calculateModelCostFromBreakdown(modelName, pricing, inputTokens, cachedTokens, outputTokens, longContextInputTokens, longContextCachedTokens, longContextOutputTokens, cacheWrite5mTokens, cacheWrite1hTokens) {
    const safeInputTokens = Math.max(0, Number(inputTokens || 0));
    const safeCachedTokens = Math.max(0, Number(cachedTokens || 0));
    const safeOutputTokens = Math.max(0, Number(outputTokens || 0));
    let safeLongContextInputTokens = 0;
    let safeLongContextCachedTokens = 0;
    let safeLongContextOutputTokens = 0;
    if (supportsOpenAILongContextPricing(modelName)) {
      safeLongContextInputTokens = Math.max(0, Number(longContextInputTokens || 0));
      safeLongContextCachedTokens = Math.max(0, Number(longContextCachedTokens || 0));
      safeLongContextOutputTokens = Math.max(0, Number(longContextOutputTokens || 0));
    }
    const cappedLongContextInputTokens = Math.min(safeLongContextInputTokens, safeInputTokens);
    const cappedLongContextCachedTokens = Math.min(safeLongContextCachedTokens, safeCachedTokens);
    const cappedLongContextOutputTokens = Math.min(safeLongContextOutputTokens, safeOutputTokens);
    const longContextUncachedInputTokens = Math.max(cappedLongContextInputTokens - cappedLongContextCachedTokens, 0);
    const uncachedInputTokens = Math.max(safeInputTokens - safeCachedTokens, 0);
    const standardUncachedInputTokens = Math.max(uncachedInputTokens - longContextUncachedInputTokens, 0);
    const standardOutputTokens = Math.max(safeOutputTokens - cappedLongContextOutputTokens, 0);
    const promptPrice = Math.max(0, Number(pricing && pricing.prompt || 0));
    const safeCacheWrite5m = Math.max(0, Number(cacheWrite5mTokens || 0));
    const safeCacheWrite1h = Math.max(0, Number(cacheWrite1hTokens || 0));
    const cost = (
      (standardUncachedInputTokens * promptPrice) +
      (longContextUncachedInputTokens * promptPrice * OPENAI_LONG_CONTEXT_PROMPT_MULTIPLIER) +
      (safeCachedTokens * Math.max(0, Number(pricing && pricing.cache || 0))) +
      (standardOutputTokens * Math.max(0, Number(pricing && pricing.completion || 0))) +
      (cappedLongContextOutputTokens * Math.max(0, Number(pricing && pricing.completion || 0)) * OPENAI_LONG_CONTEXT_COMPLETION_MULTIPLIER) +
      (safeCacheWrite5m * promptPrice * 1.25) +
      (safeCacheWrite1h * promptPrice * 2)
    ) / 1000000;
    return Number.isFinite(cost) ? cost : 0;
  }

  function readModelPrices() {
    try {
      const raw = window.localStorage.getItem(MODEL_PRICES_STORAGE_KEY);
      if (!raw) return {};
      const parsed = JSON.parse(raw);
      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) return {};
      const prices = {};
      Object.keys(parsed).forEach((modelName) => {
        if (!modelName) return;
        const entry = parsed[modelName];
        if (!entry || typeof entry !== 'object' || Array.isArray(entry)) return;
        const prompt = Number(entry.prompt);
        const completion = Number(entry.completion);
        const cache = Number(entry.cache);
        if (!Number.isFinite(prompt) && !Number.isFinite(completion) && !Number.isFinite(cache)) return;
        const safePrompt = Number.isFinite(prompt) && prompt >= 0 ? prompt : 0;
        const safeCompletion = Number.isFinite(completion) && completion >= 0 ? completion : 0;
        const safeCache = Number.isFinite(cache) && cache >= 0 ? cache : safePrompt;
        prices[modelName] = {
          prompt: safePrompt,
          completion: safeCompletion,
          cache: safeCache,
        };
      });
      return prices;
    } catch {
      return {};
    }
  }

  function calculateTotalCostFromModelSummaries(modelSummaries, modelPrices) {
    const summaries = Array.isArray(modelSummaries) ? modelSummaries : [];
    return summaries.reduce((total, item) => {
      const modelName = normalize(item && item.model);
      const pricing = modelName ? modelPrices[modelName] : null;
      if (!pricing) return total;
      const cost = calculateModelCostFromBreakdown(
        modelName,
        pricing,
        item && item.input_tokens,
        item && item.cached_tokens,
        item && item.output_tokens,
        item && item.long_context_input_tokens,
        item && item.long_context_cached_tokens,
        item && item.long_context_output_tokens,
        item && item.anthropic_cache_write_5m_tokens,
        item && item.anthropic_cache_write_1h_tokens,
      );
      return total + (Number.isFinite(cost) ? cost : 0);
    }, 0);
  }

  function filterRecentRequests(requests, timeRange) {

      const timestamp = new Date(item && item.timestamp || '').getTime();
      return Number.isFinite(timestamp) && timestamp >= cutoff;

  function filterUsageSnapshotDetails(snapshot, timeRange) {

    const details = [];
    Object.entries(snapshot.apis || {}).forEach(([apiKey, apiSnapshot]) => {
      const models = apiSnapshot && apiSnapshot.models && typeof apiSnapshot.models === 'object' ? apiSnapshot.models : {};

        const modelDetails = Array.isArray(modelSnapshot && modelSnapshot.details) ? modelSnapshot.details : [];
        modelDetails.forEach((detail) => {
          details.push({
            apiKey,

            detail: detail || {},

      });
    });
    if (!timeRange || timeRange.cutoffMs == null) return details;
    const cutoff = Date.now() - timeRange.cutoffMs;

      const timestamp = new Date(item && item.detail && item.detail.timestamp || '').getTime();
      return Number.isFinite(timestamp) && timestamp >= cutoff;

  function collectUsageSnapshotModelRows(snapshot, timeRange) {
    const rows = new Map();
    filterUsageSnapshotDetails(snapshot, timeRange).forEach(({ apiKey, model, detail }) => {
      const key = normalize(model) || 'unknown';
      const current = rows.get(key) || {
        model: key,
        requests: 0,
        failed: 0,
        totalTokens: 0,
        inputTokens: 0,
        outputTokens: 0,
        cachedTokens: 0,
        avgLatencyMs: 0,
        latencyTotalMs: 0,
        credentials: new Set(),
      };
      const tokens = detail && detail.tokens && typeof detail.tokens === 'object' ? detail.tokens : {};
      current.requests += 1;
      current.failed += detail && detail.failed ? 1 : 0;
      current.totalTokens += Number(tokens.total_tokens || 0);
      current.inputTokens += Number(tokens.input_tokens || 0);
      current.outputTokens += Number(tokens.output_tokens || 0);
      current.cachedTokens += Number(tokens.cached_tokens || 0);
      current.latencyTotalMs += Number(detail && detail.latency_ms || 0);
      if (apiKey) current.credentials.add(apiKey);
      rows.set(key, current);
    });
    return Array.from(rows.values()).map((row) => ({
      ...row,
      avgLatencyMs: row.requests > 0 ? (row.latencyTotalMs / row.requests) : 0,

  function collectUsageSnapshotCredentialRows(snapshot, timeRange) {

  function setEnhancerMarkup(node, signature, html) {
