<!-- cliproxy-management-enhancer -->
<script>
(() => {
  if (window.__cliproxyManagementEnhancer) return;
  window.__cliproxyManagementEnhancer = true;

  const STYLE_ID = 'cliproxy-management-enhancer-style';
  const TIME_RANGE_KEY = 'cli-proxy-usage-time-range-v1';
  const STORAGE_KEYS = {
    usageAuto: 'cliproxy-usage-auto-refresh-enabled-v1',
    usageInterval: 'cliproxy-usage-auto-refresh-interval-v1',
    quotaAuto: 'cliproxy-quota-auto-refresh-enabled-v1',
    quotaInterval: 'cliproxy-quota-auto-refresh-interval-v1',
    quotaPageSize: 'cliproxy-quota-page-size-v1',
  };
  const DEFAULT_USAGE_INTERVAL = 5;
  const DEFAULT_QUOTA_INTERVAL = 5;
  const DEFAULT_QUOTA_PAGE_SIZE = 6;
  const MAX_REQUEST_ROWS = 50;
  const RECENT_REQUEST_FETCH_LIMIT = 500;
  const MODEL_LIMIT = 10;
  const PROVIDER_FILTER_OPTIONS = [
    { value: '', label: 'All Providers' },
    { value: 'gemini', label: 'Gemini' },
    { value: 'codex', label: 'Codex' },
    { value: 'claude', label: 'Claude' },
    { value: 'vertex', label: 'Vertex' },
    { value: 'ampcode', label: 'ampcode' },
    { value: 'openai-compatible', label: 'OpenAI Compatible Providers' },
  ];

  let managementAuthorization = '';
  let nativeFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : null;
  const AUTH_STORAGE_KEY = 'managementKey';
  const SESSION_AUTH_STORAGE_KEY = 'cliproxy-management-key-v1';
  const API_BASE_STORAGE_KEYS = ['apiBase', 'apiUrl'];
  let usageTimer = null;
  let usageRefreshRetryTimer = null;
  let quotaTimer = null;
  let routeSyncTimer = null;
  let authPrimePromise = null;
  let usageRefreshInFlight = false;
  let lastUsageStatisticsFetchAt = 0;
  let lastUsageStatistics = null;
  let lastUsageStatisticsRangeKey = '';
  let lastUsageStatisticsProvider = '';
  let quotaRefreshInFlight = false;
  let quotaClickInterceptorInstalled = false;
  const quotaModes = new Map();

  function installStyles() {
    if (document.getElementById(STYLE_ID)) return;
    const style = document.createElement('style');
    style.id = STYLE_ID;
    style.textContent = `
      .cliproxy-enhancer__toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin: 12px 0 16px;
        padding: 12px 16px;
        border: 1px solid var(--border-color, #d5d9e0);
        border-radius: 12px;
        background: color-mix(in srgb, var(--bg-secondary, #f8fafc) 88%, transparent);
      }
      .cliproxy-enhancer__toolbar label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--text-secondary, #4b5563);
      }
      .cliproxy-enhancer__toolbar input[type="number"] {
        width: 84px;
      }
      .cliproxy-enhancer__toolbar input,
      .cliproxy-enhancer__toolbar select {
        padding: 6px 10px;
        border: 1px solid var(--border-color, #d5d9e0);
        border-radius: 10px;
        background: var(--bg-primary, #fff);
        color: var(--text-primary, #111827);
        font: inherit;
      }
      .cliproxy-enhancer__service-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 16px;
        margin: 0 0 16px;
      }
      .cliproxy-enhancer__card {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 16px;
        border: 1px solid var(--border-color, #d5d9e0);
        border-radius: 12px;
        background: color-mix(in srgb, var(--bg-secondary, #f8fafc) 86%, transparent);
      }
      .cliproxy-enhancer__label {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.03em;
        color: var(--text-secondary, #4b5563);
        text-transform: uppercase;
      }
      .cliproxy-enhancer__value {
        display: flex;
        align-items: baseline;
        gap: 8px;
        font-size: 24px;
        font-weight: 700;
        color: var(--text-primary, #111827);
      }
      .cliproxy-enhancer__value span {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-secondary, #4b5563);
      }
      .cliproxy-enhancer__hint {
        font-size: 12px;
        color: var(--text-tertiary, #6b7280);
      }
      .cliproxy-enhancer__request-events {
        margin-top: 8px;
      }
      .cliproxy-enhancer__table-wrap {
        overflow: auto;
        border: 1px solid var(--border-color, #d5d9e0);
        border-radius: 12px;
        background: var(--bg-primary, #fff);
      }
      .cliproxy-enhancer__table {
        width: 100%;
        min-width: 920px;
        border-collapse: collapse;
      }
      .cliproxy-enhancer__table th,
      .cliproxy-enhancer__table td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border-color, #e5e7eb);
        text-align: left;
        vertical-align: top;
        font-size: 13px;
      }
      .cliproxy-enhancer__table th {
        position: sticky;
        top: 0;
        background: var(--bg-secondary, #f8fafc);
        color: var(--text-secondary, #4b5563);
        font-weight: 700;
        z-index: 1;
      }
      .cliproxy-enhancer__table tr:last-child td {
        border-bottom: 0;
      }
      .cliproxy-enhancer__muted {
        color: var(--text-tertiary, #6b7280);
      }
      .cliproxy-enhancer__warning-hidden {
        display: none !important;
      }
      @media (max-width: 960px) {
        .cliproxy-enhancer__toolbar {
          align-items: stretch;
        }
      }
    `;
    document.head.appendChild(style);
  }

  function normalize(value) {
    return String(value || '').replace(/\s+/g, ' ').trim();
  }

  function isEnhancerNode(node) {
    if (!node || node.nodeType !== 1) return false;
    if (typeof node.id === 'string' && node.id.startsWith('cliproxy-')) return true;
    return Array.from(node.classList || []).some((className) => String(className || '').startsWith('cliproxy-'));
  }

  function escapeHTML(value) {
    return String(value == null ? '' : value).replace(/[&<>\"]/g, (char) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;'
    }[char]));
  }

  function parseJSONStorage(key, fallback) {
    try {
      const raw = window.localStorage.getItem(key);
      if (raw == null || raw === '') return fallback;
      return JSON.parse(raw);
    } catch {
      return fallback;
    }
  }

  function setJSONStorage(key, value) {
    try {
      window.localStorage.setItem(key, JSON.stringify(value));
    } catch {}
  }

  function getBoolSetting(key, fallback) {
    const value = parseJSONStorage(key, fallback);
    return typeof value === 'boolean' ? value : fallback;
  }

  function getIntSetting(key, fallback, min, max) {
    const value = Number(parseJSONStorage(key, fallback));
    if (!Number.isFinite(value)) return fallback;
    return Math.min(max, Math.max(min, Math.round(value)));
  }

  function getUsageAutoEnabled() {
    return getBoolSetting(STORAGE_KEYS.usageAuto, true);
  }

  function getUsageIntervalSeconds() {
    return getIntSetting(STORAGE_KEYS.usageInterval, DEFAULT_USAGE_INTERVAL, 1, 60);
  }

  function getQuotaAutoEnabled() {
    return getBoolSetting(STORAGE_KEYS.quotaAuto, false);
  }

  function getQuotaIntervalSeconds() {
    return getIntSetting(STORAGE_KEYS.quotaInterval, DEFAULT_QUOTA_INTERVAL, 1, 300);
  }

  function getQuotaPageSize() {
    return getIntSetting(STORAGE_KEYS.quotaPageSize, DEFAULT_QUOTA_PAGE_SIZE, 1, 1000);
  }

  function getMain() {
    return document.querySelector('main');
  }

  function getPageLayer() {
    const main = getMain();
    if (!main) return null;
    return main.querySelector('.page-transition__layer') || main.firstElementChild;
  }

  function getPageContainer() {
    const layer = getPageLayer();
    if (!layer) return null;
    return layer.firstElementChild || layer;
  }

  function getPageTitle() {
    const container = getPageContainer();
    const heading = container ? container.querySelector('h1') : null;
    return normalize(heading ? heading.textContent : '');
  }

  function isUsageRoute() {
    return window.location.hash.startsWith('#/usage');
  }

  function isQuotaRoute() {
    return window.location.hash.startsWith('#/quota');
  }

  function isUsagePageReady() {
    return isUsageRoute() && getPageTitle() === 'Usage Statistics';
  }

  function isQuotaPageReady() {
    return isQuotaRoute() && getPageTitle() === 'Quota Management';
  }

  function sameOriginManagementURL(input) {
    try {
      const url = new URL(input, window.location.origin);
      return url.origin === window.location.origin && url.pathname.startsWith('/v0/management/');
    } catch {
      return false;
    }
  }

  function getHeaderValue(headers, name) {
    if (!headers) return '';
    const lowerName = name.toLowerCase();
    if (headers instanceof Headers) return headers.get(name) || headers.get(lowerName) || '';
    if (Array.isArray(headers)) {
      const match = headers.find((entry) => String(entry && entry[0] || '').toLowerCase() === lowerName);
      return match ? String(match[1] || '') : '';
    }
    if (typeof headers === 'object') {
      for (const key of Object.keys(headers)) {
        if (key.toLowerCase() === lowerName) return String(headers[key] || '');
      }
    }
    return '';
  }

  function decodeStoredAuthValue(value) {
    if (!value) return '';
    const prefix = 'enc::v1::';
    if (!String(value).startsWith(prefix)) return String(value);
    try {
      const host = window.location.host;
      const userAgent = navigator.userAgent;
      const keySource = `cli-proxy-api-webui::secure-storage|${host}|${userAgent}`;
      const keyBytes = new TextEncoder().encode(keySource);
      const encoded = String(value).slice(prefix.length);
      const raw = atob(encoded);
      const data = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i += 1) data[i] = raw.charCodeAt(i);
      for (let i = 0; i < data.length; i += 1) data[i] = data[i] ^ keyBytes[i % keyBytes.length];
      return new TextDecoder().decode(data);
    } catch {
      return '';
    }
  }

  function readStoredJSONValue(key) {
    try {
      const raw = window.localStorage.getItem(key);
      if (!raw) return null;
      const decoded = decodeStoredAuthValue(raw);
      return JSON.parse(decoded);
    } catch {
      return null;
    }
  }

  function readStoredStringValue(key) {
    const parsed = readStoredJSONValue(key);
    if (typeof parsed === 'string') return parsed.trim();
    return '';
  }

  function writeSessionManagementKey(authKey) {
    try {
      const value = String(authKey || '').trim();
      if (!value) {
        window.sessionStorage.removeItem(SESSION_AUTH_STORAGE_KEY);
        return;
      }
      window.sessionStorage.setItem('cliproxy-management-key-v1', JSON.stringify(value));
    } catch {}
  }

  function readSessionManagementKey() {
    try {
      const raw = window.sessionStorage.getItem(SESSION_AUTH_STORAGE_KEY);
      if (!raw) return '';
      const parsed = JSON.parse(raw);
      return typeof parsed === 'string' ? parsed.trim() : '';
    } catch {
      return '';
    }
  }

  function readStoredManagementAuthorization() {
    const authKey = readSessionManagementKey() || readStoredStringValue(AUTH_STORAGE_KEY);
    if (!authKey) return '';
    return `Bearer ${authKey}`;
  }

  function captureManagementAuthFromLoginPage() {
    const input = document.querySelector('input[type="password"], input[name="managementKey"], input[id="managementKey"]');
    if (!(input instanceof HTMLInputElement)) return;
    const persist = () => {
      const value = String(input.value || '').trim();
      if (!value) return;
      writeSessionManagementKey(value);
      managementAuthorization = `Bearer ${value}`;
    };
    if (input.dataset.cliproxyCaptureInstalled !== 'true') {
      input.dataset.cliproxyCaptureInstalled = 'true';
      input.addEventListener('input', persist);
      input.addEventListener('change', persist);
    }
    const form = input.form || input.closest('form');
    if (form instanceof HTMLFormElement && form.dataset.cliproxyCaptureInstalled !== 'true') {
      form.dataset.cliproxyCaptureInstalled = 'true';
      form.addEventListener('submit', persist);
    }
    persist();
  }

  function captureManagementAuthorization(urlLike, headers) {
    if (!sameOriginManagementURL(urlLike)) return;
    const auth = getHeaderValue(headers, 'authorization');
    if (auth && auth.startsWith('Bearer ')) {
      managementAuthorization = auth;
      writeSessionManagementKey(auth.slice('Bearer '.length));
    }
  }

  function getUsageProviderFilter() {
    const select = document.querySelector('#cliproxy-usage-provider-filter');
    if (!(select instanceof HTMLSelectElement)) return '';
    return String(select.value || '').trim();
  }

  function appendUsageProviderFilter(urlLike) {
    try {
      const url = new URL(urlLike, window.location.origin);
      if (!isUsageRoute() || url.origin !== window.location.origin || url.pathname !== '/v0/management/usage') {
        return urlLike;
      }
      const provider = getUsageProviderFilter();
      if (provider) {
        url.searchParams.set('provider', provider);
      } else {
        url.searchParams.delete('provider');
      }
      return url.toString();
    } catch {
      return urlLike;
    }
  }

  function patchFetch() {
    if (!nativeFetch) return;
    window.fetch = async function patchedFetch(input, init) {
      let nextInput = input;
      try {
        const originalURL = typeof input === 'string' ? input : (input && input.url) || '';
        const rewrittenURL = appendUsageProviderFilter(originalURL);
        if (typeof Request !== 'undefined' && input instanceof Request) {
          if (rewrittenURL && rewrittenURL !== input.url) {
            nextInput = new Request(rewrittenURL, input);
          }
          captureManagementAuthorization(nextInput.url, nextInput.headers);
        } else {
          if (typeof input === 'string') {
            nextInput = rewrittenURL;
          }
          captureManagementAuthorization(
            rewrittenURL,
            (init && init.headers) || (input && input.headers) || null,
          );
        }
      } catch {}
      return nativeFetch(nextInput, init);
    };
  }

  function patchXHR() {
    if (!window.XMLHttpRequest) return;
    const open = XMLHttpRequest.prototype.open;
    const setRequestHeader = XMLHttpRequest.prototype.setRequestHeader;
    XMLHttpRequest.prototype.open = function patchedOpen(method, url) {
      const rewrittenURL = appendUsageProviderFilter(url);
      this.__cliproxyURL = rewrittenURL;
      this.__cliproxyHeaders = {};
      const args = Array.from(arguments);
      args[1] = rewrittenURL;
      return open.apply(this, args);
    };
    XMLHttpRequest.prototype.setRequestHeader = function patchedSetRequestHeader(name, value) {
      try {
        if (!this.__cliproxyHeaders) this.__cliproxyHeaders = {};
        this.__cliproxyHeaders[name] = value;
        captureManagementAuthorization(this.__cliproxyURL || '', this.__cliproxyHeaders);
      } catch {}
      return setRequestHeader.apply(this, arguments);
    };
  }

  function wait(ms) {
    return new Promise((resolve) => window.setTimeout(resolve, ms));
  }

  function triggerUsageRefresh() {
    const container = getPageContainer();
    if (!container) return false;
    const button = Array.from(container.querySelectorAll('button')).find((el) => normalize(el.textContent) === 'Refresh');
    if (!button || button.disabled) return false;
    button.click();
    return true;
  }

  function triggerQuotaRefreshAll() {
    const container = getPageContainer();
    if (!container) return false;
    const buttons = Array.from(container.querySelectorAll('button')).filter((el) => normalize(el.textContent) === 'Refresh all credentials' && !el.disabled);
    if (!buttons.length) return false;
    buttons.forEach((button) => button.click());
    return true;
  }

  async function ensureManagementAuth() {
    captureManagementAuthFromLoginPage();
    if (!managementAuthorization) {
      managementAuthorization = readStoredManagementAuthorization();
    }
    if (managementAuthorization) return true;
    if (authPrimePromise) return authPrimePromise;
    authPrimePromise = (async () => {
      if (isUsagePageReady()) {
        triggerUsageRefresh();
      } else if (isQuotaPageReady()) {
        const container = getPageContainer();
        const refreshButton = container ? container.querySelector('button[aria-label="Refresh all credentials"]') : null;
        if (refreshButton && !refreshButton.disabled) refreshButton.click();
      }
      const deadline = Date.now() + 3000;
      while (!managementAuthorization && Date.now() < deadline) {
        captureManagementAuthFromLoginPage();
        managementAuthorization = readStoredManagementAuthorization() || managementAuthorization;
        if (managementAuthorization) break;
        await wait(100);
      }
      return !!managementAuthorization;
    })().finally(() => {
      authPrimePromise = null;
    });
    return authPrimePromise;
  }

  function readUsageTimeRangeValue(container) {
    if (!container) return '';
    const rangeButton = container.querySelector('button[aria-label="Time Range"]') || Array.from(container.querySelectorAll('button')).find((el) => {
      const text = normalize(el.textContent);
      return text === 'All Time' || text === 'Last 7 Hours' || text === 'Last 24 Hours' || text === 'Last 7 Days';
    });
    return normalize(rangeButton ? rangeButton.textContent : '');
  }

  function getUsageTimeRange() {
    const container = getPageContainer();
    let value = readUsageTimeRangeValue(container);
    if (value) {
      setJSONStorage(TIME_RANGE_KEY, value);
    } else {
      value = parseJSONStorage(TIME_RANGE_KEY, 'Last 24 Hours');
    }
    value = normalize(value).toLowerCase();
    if (value === '7h' || value === 'last 7 hours') {
      return { key: '7h', label: 'Last 7 Hours', days: 1, cutoffMs: 7 * 60 * 60 * 1000, since: new Date(Date.now() - 7 * 60 * 60 * 1000).toISOString() };
    }
    if (value === '7d' || value === 'last 7 days') {
      return { key: '7d', label: 'Last 7 Days', days: 7, cutoffMs: 7 * 24 * 60 * 60 * 1000, since: new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString() };
    }
    if (value === 'all' || value === 'all time') {
      return { key: 'all', label: 'All Time', days: 3650, cutoffMs: null, since: '' };
    }
    return { key: '24h', label: 'Last 24 Hours', days: 1, cutoffMs: 24 * 60 * 60 * 1000, since: new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString() };
  }

  async function fetchCacheStatistics(timeRange, limit) {
    const ready = await ensureManagementAuth();
    if (!ready || !nativeFetch || !managementAuthorization) return null;
    const url = new URL('/v0/management/cache-statistics', window.location.origin);
    if (timeRange && timeRange.since) {
      url.searchParams.set('since', String(timeRange.since));
    } else {
      url.searchParams.set('days', String(timeRange && timeRange.days || 14));
    }
    const provider = getUsageProviderFilter();
    if (provider) {
      url.searchParams.set('provider', provider);
    }
    url.searchParams.set('limit', String(limit));
    url.searchParams.set('model_limit', String(MODEL_LIMIT));
    const response = await nativeFetch(url.toString(), {
      headers: { Authorization: managementAuthorization },
    });
    if (!response.ok) return null;
    const payload = await response.json();
    return payload && payload.cache_statistics ? payload.cache_statistics : null;
  }

  function formatInteger(value) {
    return new Intl.NumberFormat().format(Number(value || 0));
  }

  function formatCompact(value) {
    return new Intl.NumberFormat(undefined, { notation: 'compact', maximumFractionDigits: 1 }).format(Number(value || 0));
  }

  function formatDateTime(value) {
    if (!value) return '';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return '';
    return date.toLocaleString();
  }

  function filterRecentRequests(requests, timeRange) {
    const list = Array.isArray(requests) ? requests.slice() : [];
    if (timeRange.cutoffMs == null) return list;
    const cutoff = Date.now() - timeRange.cutoffMs;
    return list.filter((item) => {
      const timestamp = new Date(item && item.timestamp || '').getTime();
      return Number.isFinite(timestamp) && timestamp >= cutoff;
    });
  }

  function findUsageChildBlock(container, needle) {
    return Array.from(container.children).find((child) => !isEnhancerNode(child) && normalize(child.textContent).includes(needle));
  }

  function ensureUsageControls(container) {
    const header = container.querySelector('h1') && container.querySelector('h1').parentElement;
    if (!header || !header.parentElement) return null;
    let controls = container.querySelector('#cliproxy-usage-controls');
    if (!controls) {
      controls = document.createElement('div');
      controls.id = 'cliproxy-usage-controls';
      controls.className = 'cliproxy-enhancer__toolbar';
      controls.innerHTML = `
        <label>
          Provider
          <select id="cliproxy-usage-provider-filter">${PROVIDER_FILTER_OPTIONS.map((option) => `<option value="${option.value}">${option.label}</option>`).join('')}</select>
        </label>
        <label>
          <input id="cliproxy-usage-auto-refresh-toggle" type="checkbox">
          Usage auto refresh
        </label>
        <label>
          Every
          <input id="cliproxy-usage-auto-refresh-interval" type="number" min="1" max="60" step="1">
          sec
        </label>
        <span class="cliproxy-enhancer__hint">Follows the page-global Usage Statistics time filter.</span>
      `;
      header.insertAdjacentElement('afterend', controls);
      const provider = controls.querySelector('#cliproxy-usage-provider-filter');
      const toggle = controls.querySelector('#cliproxy-usage-auto-refresh-toggle');
      const interval = controls.querySelector('#cliproxy-usage-auto-refresh-interval');
      provider.addEventListener('change', () => {
        lastUsageStatisticsFetchAt = 0;
        lastUsageStatistics = null;
        lastUsageStatisticsRangeKey = '';
        refreshUsagePage(false).catch(() => {});
      });
      toggle.addEventListener('change', () => {
        setJSONStorage(STORAGE_KEYS.usageAuto, toggle.checked);
        startUsageTimer();
      });
      interval.addEventListener('change', () => {
        const next = Math.min(60, Math.max(1, Math.round(Number(interval.value) || DEFAULT_USAGE_INTERVAL)));
        interval.value = String(next);
        setJSONStorage(STORAGE_KEYS.usageInterval, next);
        startUsageTimer();
      });
    }
    controls.querySelector('#cliproxy-usage-auto-refresh-toggle').checked = getUsageAutoEnabled();
    controls.querySelector('#cliproxy-usage-auto-refresh-interval').value = String(getUsageIntervalSeconds());
    return controls;
  }

  function ensureServiceHealthRow(container) {
    let row = container.querySelector('#cliproxy-service-health-row, #cliproxy-usage-service-health');
    if (!row) {
      row = document.createElement('div');
      row.id = 'cliproxy-service-health-row';
      row.className = 'cliproxy-enhancer__service-row cliproxy-service-health-row';
    } else {
      row.id = 'cliproxy-service-health-row';
      row.className = 'cliproxy-enhancer__service-row cliproxy-service-health-row';
    }
    if (!row.isConnected) {
      const controls = container.querySelector('#cliproxy-usage-controls');
      if (controls && controls.parentElement) {
        controls.insertAdjacentElement('afterend', row);
      } else {
        container.insertBefore(row, container.children[1] || null);
      }
    }
    return row;
  }

  function setEnhancerMarkup(node, signature, html) {
    if (!node) return false;
    const nextSignature = String(signature || '');
    if (node.dataset.cliproxySignature === nextSignature) return false;
    node.dataset.cliproxySignature = nextSignature;
    node.innerHTML = html;
    return true;
  }

  function updateServiceHealthRow(row, summary, label) {
    const total = Number(summary && summary.total_requests || 0);
    const failed = Number(summary && summary.failed_requests || 0);
    const success = Math.max(total - failed, 0);
    const rate = total > 0 ? ((success / total) * 100).toFixed(2) : '0.00';
    const signature = ['service-health', label, total, failed, rate].join(':');
    setEnhancerMarkup(row, signature, `
      <div class="cliproxy-enhancer__card">
        <div class="cliproxy-enhancer__label">Service Health</div>
        <div class="cliproxy-enhancer__hint">${escapeHTML(label)}</div>
      </div>
      <div class="cliproxy-enhancer__card">
        <div class="cliproxy-enhancer__label">Success</div>
        <div class="cliproxy-enhancer__value">${escapeHTML(formatInteger(success))}</div>
      </div>
      <div class="cliproxy-enhancer__card">
        <div class="cliproxy-enhancer__label">Failure</div>
        <div class="cliproxy-enhancer__value">${escapeHTML(formatInteger(failed))}</div>
      </div>
      <div class="cliproxy-enhancer__card">
        <div class="cliproxy-enhancer__label">Success Rate</div>
        <div class="cliproxy-enhancer__value">${escapeHTML(rate)}<span>%</span></div>
      </div>
    `);
  }

  function patchCachedTokensCard(container, summary) {
    const metricsBlock = Array.from(container.children).find((child) => {
      const text = normalize(child.textContent);
      return text.includes('Total Requests') && text.includes('Total Tokens') && text.includes('RPM');
    });
    if (!metricsBlock) return;
    const children = Array.from(metricsBlock.children);
    const totalCard = children.find((child) => normalize(child.textContent).includes('Total Tokens'));
    let cachedCard = children.find((child) => normalize(child.textContent).includes('Cached Tokens'));
    if (!cachedCard) {
      cachedCard = document.createElement('div');
      cachedCard.className = totalCard ? totalCard.className : 'cliproxy-enhancer__card';
      if (totalCard && totalCard.parentElement) {
        totalCard.insertAdjacentElement('afterend', cachedCard);
      } else {
        metricsBlock.appendChild(cachedCard);
      }
    }
    const cachedTokens = Number(summary && summary.cached_tokens || 0);
    const inputTokens = Number(summary && summary.input_tokens || 0);
    const percentage = inputTokens > 0 ? ((cachedTokens / inputTokens) * 100).toFixed(2) : '0.00';
    const signature = ['cached-card', cachedTokens, inputTokens, percentage].join(':');
    setEnhancerMarkup(cachedCard, signature, `
      <div class="cliproxy-enhancer__label">Cached Tokens</div>
      <div class="cliproxy-enhancer__value">${escapeHTML(formatCompact(cachedTokens))}<span>${escapeHTML(percentage)}%</span></div>
      <div class="cliproxy-enhancer__hint">${escapeHTML(formatInteger(cachedTokens))} persisted cached tokens</div>
    `);
  }

  function hideUsageBlocks(container) {
    const linesBlock = findUsageChildBlock(container, 'Lines to display');
    if (linesBlock) linesBlock.style.display = 'none';
    const serviceHealthBlock = findUsageChildBlock(container, 'Service Health');
    if (serviceHealthBlock) serviceHealthBlock.style.display = 'none';
  }

  function renderRequestEvents(container, stats, timeRange) {
    const requestBlock = findUsageChildBlock(container, 'Request Events');
    if (!requestBlock) return;
    requestBlock.style.display = 'none';
    let panel = container.querySelector('#cliproxy-request-events');
    if (!panel) {
      panel = document.createElement('div');
      panel.id = 'cliproxy-request-events';
      panel.className = 'cliproxy-enhancer__request-events cliproxy-request-events';
    }
    if (requestBlock.nextElementSibling !== panel) {
      requestBlock.insertAdjacentElement('afterend', panel);
    }
    const requests = filterRecentRequests(stats && stats.recent_requests || [], timeRange).slice(0, MAX_REQUEST_ROWS);
    const signature = ['request-events', timeRange.key, requests.map((item) => `${item.id || ''}:${item.timestamp || ''}:${item.total_tokens || 0}`).join('|')].join(':');
    setEnhancerMarkup(panel, signature, `
      <div class="cliproxy-enhancer__label">Request Events</div>
      <div class="cliproxy-enhancer__hint">Latest ${MAX_REQUEST_ROWS} persisted request events within ${escapeHTML(timeRange.label)}.</div>
      <div class="cliproxy-enhancer__table-wrap">
        <table class="cliproxy-enhancer__table">
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Model Name</th>
              <th>Reasoning Effort</th>
              <th>Cache Policy</th>
              <th>Input Tokens</th>
              <th>Output Tokens</th>
              <th>Reasoning Tokens</th>
              <th>Cache Read</th>
              <th>Cache Write</th>
            </tr>
          </thead>
          <tbody>
            ${requests.length ? requests.map((item) => {
              const policy = item.anthropic_rewrite_applied
                ? [
                    item.anthropic_cache_ttl || 'n/a',
                    item.anthropic_breakpoints || 'none',
                    item.anthropic_overwrote_client_layout ? 'overwrite' : 'preserve',
                    item.anthropic_matched_agentic_loop ? 'agentic' : 'general',
                  ].join(' · ')
                : 'n/a';
              const anthropicCacheRead = Number(item.anthropic_cache_read_input_tokens || 0);
              const anthropicCacheWrite = Number(item.anthropic_cache_creation_input_tokens || 0);
              const isAnthropicRow = item.anthropic_rewrite_applied || anthropicCacheRead > 0 || anthropicCacheWrite > 0;
              const cacheRead = isAnthropicRow ? anthropicCacheRead : Number(item.cached_tokens || 0);
              const cacheWrite = isAnthropicRow ? anthropicCacheWrite : 0;
              return `
              <tr>
                <td>${escapeHTML(formatDateTime(item.timestamp))}</td>
                <td>${escapeHTML(item.model || '')}</td>
                <td>${escapeHTML(item.reasoning_effort || 'n/a')}</td>
                <td>${escapeHTML(policy)}</td>
                <td>${escapeHTML(formatInteger(item.input_tokens))}</td>
                <td>${escapeHTML(formatInteger(item.output_tokens))}</td>
                <td>${escapeHTML(formatInteger(item.reasoning_tokens))}</td>
                <td>${escapeHTML(formatInteger(cacheRead))}</td>
                <td>${escapeHTML(formatInteger(cacheWrite))}</td>
              </tr>
            `; }).join('') : `
              <tr>
                <td colspan="9" class="cliproxy-enhancer__muted">No request events for the selected window.</td>
              </tr>
            `}
          </tbody>
        </table>
      </div>
    `);
  }

  function renderUsageStatistics(container, stats, timeRange) {
    updateServiceHealthRow(ensureServiceHealthRow(container), stats.summary || {}, timeRange.label);
    patchCachedTokensCard(container, stats.summary || {});
    renderRequestEvents(container, stats, timeRange);
  }

  function scheduleUsageRefreshRetry(delayMs) {
    if (usageRefreshRetryTimer) return;
    usageRefreshRetryTimer = window.setTimeout(() => {
      usageRefreshRetryTimer = null;
      if (!isUsagePageReady() || document.hidden) return;
      refreshUsagePage(true).catch(() => {});
    }, Math.max(0, delayMs));
  }

  async function refreshUsagePage(background) {
    if (usageRefreshInFlight || !isUsagePageReady()) return;
    usageRefreshInFlight = true;
    try {
      const container = getPageContainer();
      if (!container) return;
      ensureUsageControls(container);
      hideUsageBlocks(container);
      const timeRange = getUsageTimeRange();
      const minIntervalMs = getUsageIntervalSeconds() * 1000;
      const elapsedMs = Date.now() - lastUsageStatisticsFetchAt;
      const sameRange = lastUsageStatisticsRangeKey === timeRange.key;
      const sameFilter = lastUsageStatisticsProvider === getUsageProviderFilter();
      const remainingMs = lastUsageStatisticsFetchAt > 0 && sameRange && sameFilter ? Math.max(0, minIntervalMs - elapsedMs) : 0;
      if (remainingMs > 0) {
        if (lastUsageStatistics && sameRange && sameFilter) {
          renderUsageStatistics(container, lastUsageStatistics, timeRange);
        }
        scheduleUsageRefreshRetry(remainingMs);
        return;
      }
      const stats = await fetchCacheStatistics(timeRange, RECENT_REQUEST_FETCH_LIMIT);
      if (!stats) return;
      lastUsageStatisticsFetchAt = Date.now();
      lastUsageStatistics = stats;
      lastUsageStatisticsRangeKey = timeRange.key;
      lastUsageStatisticsProvider = getUsageProviderFilter();
      renderUsageStatistics(container, stats, timeRange);
    } finally {
      usageRefreshInFlight = false;
    }
  }

  function findFiberFromElement(element) {
    if (!element) return null;
    const key = Object.keys(element).find((entry) => entry.startsWith('__reactFiber$'));
    return key ? element[key] : null;
  }

  function findFiberByName(element, name) {
    let fiber = findFiberFromElement(element);
    while (fiber) {
      const fiberName = fiber.elementType && fiber.elementType.name || fiber.type && fiber.type.name || fiber.type;
      if (fiberName === name) return fiber;
      fiber = fiber.return;
    }
    return null;
  }

  function getQuotaFiberState(element) {
    const fiber = findFiberByName(element, 'cf');
    if (!fiber) return null;
    let hook = fiber.memoizedState;
    let viewModeDispatch = null;
    let warningDispatch = null;
    let currentPageDispatch = null;
    let pageSizeDispatch = null;
    while (hook) {
      const value = hook.memoizedState;
      const dispatch = hook.queue && hook.queue.dispatch;
      if (!viewModeDispatch && value === 'paged' && dispatch) {
        viewModeDispatch = dispatch;
      } else if (viewModeDispatch && !warningDispatch && typeof value === 'boolean' && dispatch) {
        warningDispatch = dispatch;
      } else if (viewModeDispatch && warningDispatch && !currentPageDispatch && typeof value === 'number' && dispatch) {
        currentPageDispatch = dispatch;
      } else if (currentPageDispatch && !pageSizeDispatch && typeof value === 'number' && dispatch) {
        pageSizeDispatch = dispatch;
        break;
      }
      hook = hook.next;
    }
    return {
      fiber,
      viewModeDispatch,
      warningDispatch,
      currentPageDispatch,
      pageSizeDispatch,
    };
  }

  function getQuotaSectionContexts(container) {
    return Array.from(container.querySelectorAll('.card')).map((card, index) => {
      const refreshButton = Array.from(card.querySelectorAll('button')).find((button) => normalize(button.textContent) === 'Refresh all credentials');
      if (!refreshButton) return null;
      const state = getQuotaFiberState(refreshButton);
      if (!state) return null;
      const props = state.fiber.memoizedProps || {};
      let count = 0;
      try {
        if (Array.isArray(props.files) && props.config && typeof props.config.filterFn === 'function') {
          count = props.files.filter(props.config.filterFn).length;
        }
      } catch {}
      if (!count) {
        const badge = card.querySelector('.QuotaPage-module__countBadge___tuPLs');
        count = Number(badge ? badge.textContent : 0) || 0;
      }
      const key = props.config && props.config.i18nPrefix ? String(props.config.i18nPrefix) : `quota-${index}`;
      return { key, card, refreshButton, count, state };
    }).filter(Boolean);
  }

  function applyQuotaMode(context, mode) {
    const storedPageSize = getQuotaPageSize();
    const nextPageSize = mode === 'all' ? Math.max(context.count, 1) : storedPageSize;
    quotaModes.set(context.key, mode);
    if (context.state.viewModeDispatch) context.state.viewModeDispatch('paged');
    if (context.state.warningDispatch) context.state.warningDispatch(false);
    if (context.state.currentPageDispatch) context.state.currentPageDispatch(1);
    if (context.state.pageSizeDispatch) context.state.pageSizeDispatch(nextPageSize);
  }

  function hideQuotaWarnings() {
    Array.from(document.querySelectorAll('.QuotaPage-module__warningOverlay___lVjB7, .QuotaPage-module__warningModal___2pPNd')).forEach((node) => {
      node.classList.add('cliproxy-enhancer__warning-hidden');
      node.setAttribute('aria-hidden', 'true');
      node.style.display = 'none';
    });
    const container = getPageContainer();
    if (!container) return;
    getQuotaSectionContexts(container).forEach((context) => {
      if (context.state.warningDispatch) context.state.warningDispatch(false);
    });
  }

  function ensureQuotaControls(container) {
    const header = container.querySelector('h1') && container.querySelector('h1').parentElement;
    if (!header || !header.parentElement) return null;
    let controls = container.querySelector('#cliproxy-quota-controls');
    if (!controls) {
      controls = document.createElement('div');
      controls.id = 'cliproxy-quota-controls';
      controls.className = 'cliproxy-enhancer__toolbar';
      controls.innerHTML = `
        <label>
          <input id="cliproxy-quota-auto-refresh-toggle" type="checkbox">
          Quota auto refresh
        </label>
        <label>
          Every
          <input id="cliproxy-quota-auto-refresh-interval" type="number" min="1" max="300" step="1">
          sec
        </label>
        <label>
          Paged view size
          <input id="cliproxy-quota-page-size" type="number" min="1" max="1000" step="1">
        </label>
      `;
      header.insertAdjacentElement('afterend', controls);
      const autoToggle = controls.querySelector('#cliproxy-quota-auto-refresh-toggle');
      const interval = controls.querySelector('#cliproxy-quota-auto-refresh-interval');
      const pageSize = controls.querySelector('#cliproxy-quota-page-size');
      autoToggle.addEventListener('change', () => {
        setJSONStorage(STORAGE_KEYS.quotaAuto, autoToggle.checked);
        startQuotaTimer();
      });
      interval.addEventListener('change', () => {
        const next = Math.min(300, Math.max(1, Math.round(Number(interval.value) || DEFAULT_QUOTA_INTERVAL)));
        interval.value = String(next);
        setJSONStorage(STORAGE_KEYS.quotaInterval, next);
        startQuotaTimer();
      });
      pageSize.addEventListener('change', () => {
        const next = Math.min(1000, Math.max(1, Math.round(Number(pageSize.value) || DEFAULT_QUOTA_PAGE_SIZE)));
        pageSize.value = String(next);
        setJSONStorage(STORAGE_KEYS.quotaPageSize, next);
        const contexts = getQuotaSectionContexts(container);
        contexts.forEach((context) => {
          if ((quotaModes.get(context.key) || 'paged') !== 'all') {
            applyQuotaMode(context, 'paged');
          }
        });
      });
    }
    controls.querySelector('#cliproxy-quota-auto-refresh-toggle').checked = getQuotaAutoEnabled();
    controls.querySelector('#cliproxy-quota-auto-refresh-interval').value = String(getQuotaIntervalSeconds());
    controls.querySelector('#cliproxy-quota-page-size').value = String(getQuotaPageSize());
    return controls;
  }

  function installQuotaClickInterceptor() {
    if (quotaClickInterceptorInstalled) return;
    quotaClickInterceptorInstalled = true;
    document.addEventListener('click', (event) => {
      if (!isQuotaPageReady()) return;
      const button = event.target && event.target.closest ? event.target.closest('button') : null;
      if (!button) return;
      const text = normalize(button.textContent);
      if (text !== 'Show all' && text !== 'Paged' && text !== 'Confirm') return;
      const container = getPageContainer();
      if (!container) return;
      if (text === 'Confirm') {
        event.preventDefault();
        event.stopPropagation();
        if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        hideQuotaWarnings();
        return;
      }
      const card = button.closest('.card');
      if (!card) return;
      const context = getQuotaSectionContexts(container).find((item) => item.card === card);
      if (!context) return;
      event.preventDefault();
      event.stopPropagation();
      if (event.stopImmediatePropagation) event.stopImmediatePropagation();
      applyQuotaMode(context, text === 'Show all' ? 'all' : 'paged');
      hideQuotaWarnings();
    }, true);
  }

  async function refreshQuotaPage(background) {
    if (quotaRefreshInFlight || !isQuotaPageReady()) return;
    quotaRefreshInFlight = true;
    try {
      const container = getPageContainer();
      if (!container) return;
      ensureQuotaControls(container);
      installQuotaClickInterceptor();
      hideQuotaWarnings();
      const contexts = getQuotaSectionContexts(container);
      contexts.forEach((context) => {
        const mode = quotaModes.get(context.key) || 'paged';
        applyQuotaMode(context, mode);
      });
    } finally {
      quotaRefreshInFlight = false;
    }
  }

  function stopUsageTimer() {
    if (usageTimer) {
      window.clearInterval(usageTimer);
      usageTimer = null;
    }
    if (usageRefreshRetryTimer) {
      window.clearTimeout(usageRefreshRetryTimer);
      usageRefreshRetryTimer = null;
    }
  }

  function stopQuotaTimer() {
    if (quotaTimer) {
      window.clearInterval(quotaTimer);
      quotaTimer = null;
    }
  }

  function startUsageTimer() {
    stopUsageTimer();
    if (!getUsageAutoEnabled()) return;
    usageTimer = window.setInterval(() => {
      if (!isUsagePageReady() || document.hidden) return;
      triggerUsageRefresh();
      refreshUsagePage(true).catch(() => {});
    }, getUsageIntervalSeconds() * 1000);
  }

  function startQuotaTimer() {
    stopQuotaTimer();
    if (!getQuotaAutoEnabled()) return;
    quotaTimer = window.setInterval(() => {
      if (!isQuotaPageReady() || document.hidden) return;
      triggerQuotaRefreshAll();
      refreshQuotaPage(true).catch(() => {});
    }, getQuotaIntervalSeconds() * 1000);
  }

  function isEnhancerManagedNode(node) {
    let current = node && node.nodeType === 3 ? node.parentElement : node;
    while (current && current !== document.body) {
      const id = typeof current.id === 'string' ? current.id : '';
      const className = typeof current.className === 'string' ? current.className : '';
      if (id.startsWith('cliproxy-') || className.includes('cliproxy-')) {
        return true;
      }
      current = current.parentElement;
    }
    return false;
  }

  function shouldIgnoreRouteSyncMutations(mutations) {
    return mutations.every((mutation) => {
      if (!isEnhancerManagedNode(mutation.target)) return false;
      const addedNodes = Array.from(mutation.addedNodes || []);
      if (addedNodes.some((node) => !isEnhancerManagedNode(node))) return false;
      const removedNodes = Array.from(mutation.removedNodes || []);
      if (removedNodes.some((node) => !isEnhancerManagedNode(node))) return false;
      return true;
    });
  }

  function syncRouteSoon() {
    if (routeSyncTimer) return;
    routeSyncTimer = window.setTimeout(() => {
      routeSyncTimer = null;
      if (window.location.hash === '#cache-statistics') {
        history.replaceState(null, '', `${window.location.pathname}${window.location.search}#/usage`);
      }
      if (isUsagePageReady()) {
        stopQuotaTimer();
        refreshUsagePage(false).catch(() => {});
        startUsageTimer();
        return;
      }
      if (isQuotaPageReady()) {
        stopUsageTimer();
        refreshQuotaPage(false).catch(() => {});
        startQuotaTimer();
        return;
      }
      stopUsageTimer();
      stopQuotaTimer();
    }, 50);
  }

  installStyles();
  captureManagementAuthFromLoginPage();
  patchFetch();
  patchXHR();
  window.addEventListener('hashchange', syncRouteSoon);
  new MutationObserver((mutations) => {
    if (shouldIgnoreRouteSyncMutations(mutations)) return;
    syncRouteSoon();
  }).observe(document.body, { childList: true, subtree: true });
  syncRouteSoon();
})();
</script>
