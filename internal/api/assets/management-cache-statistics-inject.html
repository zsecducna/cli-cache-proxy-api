      });
    });
    return true;
  }

  function updateServiceHealthRow(row, summary, label) {
    const total = Number(summary && summary.total_requests || 0);
    const failed = Number(summary && summary.failed_requests || 0);
    const success = Math.max(total - failed, 0);
    const rate = total > 0 ? ((success / total) * 100).toFixed(2) : '0.00';
    const signature = ['service-health', label, total, failed, rate].join(':');
    setEnhancerMarkup(row, signature, `
      <div class="cliproxy-enhancer__card">
        <div class="cliproxy-enhancer__label">Service Health</div>
        <div class="cliproxy-enhancer__hint">${escapeHTML(label)}</div>
      </div>
      <div class="cliproxy-enhancer__card">
        <div class="cliproxy-enhancer__label">Success</div>
        <div class="cliproxy-enhancer__value">${escapeHTML(formatInteger(success))}</div>
      </div>
      <div class="cliproxy-enhancer__card">
        <div class="cliproxy-enhancer__label">Failure</div>
        <div class="cliproxy-enhancer__value">${escapeHTML(formatInteger(failed))}</div>
      </div>
      <div class="cliproxy-enhancer__card">
        <div class="cliproxy-enhancer__label">Success Rate</div>
        <div class="cliproxy-enhancer__value">${escapeHTML(rate)}<span>%</span></div>
      </div>
    `);
  }

  function findUsageMetricsBlock(container) {
    if (!container) return null;
    const preferred = Array.from(container.querySelectorAll('div')).find((node) => {
      const className = typeof node.className === 'string' ? node.className : '';
      return className.includes('statsGrid') && isUsageMetricsBlock(node);
    });
    const metricsBlock = preferred || Array.from(container.querySelectorAll('div')).find((node) => isUsageMetricsBlock(node)) || null;
    if (metricsBlock) {
      metricsBlock.classList.add('cliproxy-enhancer__usage-metrics-grid');
    }
    return metricsBlock;
  }

  function findUsageMetricCard(metricsBlock, label) {
    if (!metricsBlock) return null;
    const needle = normalize(label);
    const cards = Array.from(metricsBlock.children || []);
    return cards.find((child) => Array.from(child.querySelectorAll('.cliproxy-enhancer__label, div, span')).some((node) => normalize(node.textContent) === needle))
      || cards.find((child) => normalize(child.textContent).includes(needle))
      || null;
  }

  function setUsageCardValue(card, label, value, hint, signatureParts) {
    if (!card) return false;
    return setEnhancerMarkup(card, signatureParts.join(':'), `
      <div class="cliproxy-enhancer__label">${escapeHTML(label)}</div>
      <div class="cliproxy-enhancer__value">${value}</div>
      <div class="cliproxy-enhancer__hint">${escapeHTML(hint)}</div>
    `);
  }

  function patchUsageSummaryCards(container, stats, timeRange) {
    const metricsBlock = findUsageMetricsBlock(container);
    if (!metricsBlock) return;
    const summary = stats && stats.summary || {};
    const modelSummaries = stats && stats.by_model || [];
    const totalRequests = Number(summary && summary.total_requests || 0);
    const totalTokens = Number(summary && summary.total_tokens || 0);
    const avgLatencyMs = Number(summary && summary.avg_latency_ms || 0);
    const minutes = timeRange && Number.isFinite(timeRange.cutoffMs) && timeRange.cutoffMs > 0
      ? (timeRange.cutoffMs / (60 * 1000))
      : 0;
    const rpm = minutes > 0 ? (totalRequests / minutes) : 0;
    const tpm = minutes > 0 ? (totalTokens / minutes) : 0;
    const modelPrices = readModelPrices();
    const hasModelPrices = Object.keys(modelPrices).length > 0;
    const totalCost = hasModelPrices ? calculateTotalCostFromModelSummaries(modelSummaries, modelPrices) : 0;
    const totalRequestsCard = findUsageMetricCard(metricsBlock, 'Total Requests');
    const totalTokensCard = findUsageMetricCard(metricsBlock, 'Total Tokens');
    const rpmCard = findUsageMetricCard(metricsBlock, 'RPM');
    const tpmCard = findUsageMetricCard(metricsBlock, 'TPM');
    const totalCostCard = findUsageMetricCard(metricsBlock, 'Total Cost');
    setUsageCardValue(
      totalRequestsCard,
      'Total Requests',
      escapeHTML(formatCompact(totalRequests)),
      `${timeRange ? timeRange.label : 'Selected window'} persisted requests`,
      ['usage-total-requests', timeRange && timeRange.key || '', getUsageProviderFilter(), totalRequests],
    );
    setUsageCardValue(
      totalTokensCard,
      'Total Tokens',
      escapeHTML(formatCompact(totalTokens)),
      `${formatInteger(totalTokens)} tokens across ${formatInteger(totalRequests)} requests`,
      ['usage-total-tokens', timeRange && timeRange.key || '', getUsageProviderFilter(), totalTokens, totalRequests],
    );
    setUsageCardValue(
      rpmCard,
      'RPM',
      escapeHTML(minutes > 0 ? rpm.toFixed(rpm >= 100 ? 0 : 1) : '0.0'),
      minutes > 0
        ? `${timeRange.label} average requests per minute`
        : `${timeRange ? timeRange.label : 'Selected window'} average unavailable`,
      ['usage-rpm', timeRange && timeRange.key || '', getUsageProviderFilter(), totalRequests, Math.round(minutes), Math.round(avgLatencyMs)],
    );
    setUsageCardValue(
      tpmCard,
      'TPM',
      escapeHTML(minutes > 0 ? tpm.toFixed(tpm >= 100 ? 0 : 1) : '0.0'),
      minutes > 0
        ? `${timeRange.label} average tokens per minute`
        : `${timeRange ? timeRange.label : 'Selected window'} average unavailable`,
      ['usage-tpm', timeRange && timeRange.key || '', getUsageProviderFilter(), totalTokens, Math.round(minutes)],
    );
    setUsageCardValue(
      totalCostCard,
      'Total Cost',
      hasModelPrices ? escapeHTML(formatCurrency(totalCost)) : '--',
      hasModelPrices
        ? `${timeRange ? timeRange.label : 'Selected window'} estimated cost from stored model pricing`
        : 'Set model pricing to estimate cost',
      ['usage-total-cost', timeRange && timeRange.key || '', getUsageProviderFilter(), Math.round(totalCost * 100), Object.keys(modelPrices).length],
    );
  }

  function patchCachedTokensCard(container, summary, timeRange) {
    const metricsBlock = findUsageMetricsBlock(container);
    if (!metricsBlock) return;
    const totalCard = findUsageMetricCard(metricsBlock, 'Total Tokens');
    let cachedCard = findUsageMetricCard(metricsBlock, 'Cached Tokens');
    if (!cachedCard) {
      cachedCard = document.createElement('div');
      cachedCard.className = totalCard ? totalCard.className : 'cliproxy-enhancer__card';
      if (totalCard && totalCard.parentElement) {
        totalCard.insertAdjacentElement('afterend', cachedCard);
      } else {
        metricsBlock.appendChild(cachedCard);
      }
    }
    const cachedTokens = Number(summary && summary.cached_tokens || 0);
    const inputTokens = Number(summary && summary.input_tokens || 0);
    const effectiveInputTokens = Number(summary && summary.effective_input_tokens || inputTokens || 0);
    // Kiro (AWS CodeWhisperer) reports no token-level cache counts, so cached_tokens
    // is always 0 for Kiro traffic and the token ratio would read a misleading 0%.
    // When the summary carries the Kiro credit signal, show the derived cache-savings
    // ratio (credits saved vs the cold per-input baseline) and total credits instead.
    const kiroCredits = Number(summary && summary.kiro_credits || 0);
    if (kiroCredits > 0) {
      const savingsRatio = Number(summary && summary.kiro_cache_savings_ratio || 0);
      const savingsPct = (savingsRatio * 100).toFixed(2);
      const ctxUsagePct = (Number(summary && summary.kiro_context_usage_percent || 0) * 100).toFixed(1);
      const kiroSignature = ['cached-card-kiro', timeRange && timeRange.key || '', getUsageProviderFilter(), kiroCredits, savingsPct, ctxUsagePct].join(':');
      setEnhancerMarkup(cachedCard, kiroSignature, `
      <div class="cliproxy-enhancer__label">Kiro Cache Savings</div>
      <div class="cliproxy-enhancer__value">${escapeHTML(savingsPct)}%<span>${escapeHTML(formatCompact(kiroCredits))} credits</span></div>
      <div class="cliproxy-enhancer__hint">credits saved vs cold baseline; avg context usage ${escapeHTML(ctxUsagePct)}% (Kiro reports cache benefit as reduced credits, not cached tokens)</div>
    `);
      return;
    }
    const percentage = effectiveInputTokens > 0 ? ((cachedTokens / effectiveInputTokens) * 100).toFixed(2) : '0.00';
    const signature = ['cached-card', timeRange && timeRange.key || '', getUsageProviderFilter(), cachedTokens, effectiveInputTokens, percentage].join(':');
    setEnhancerMarkup(cachedCard, signature, `
      <div class="cliproxy-enhancer__label">Cached Tokens</div>
      <div class="cliproxy-enhancer__value">${escapeHTML(formatCompact(cachedTokens))}<span>${escapeHTML(percentage)}%</span></div>
      <div class="cliproxy-enhancer__hint">${escapeHTML(formatInteger(cachedTokens))} cached tokens over ${escapeHTML(formatInteger(effectiveInputTokens))} effective input tokens</div>
    `);
  }

  function patchAverageLatencyCard(container, summary, timeRange) {
    const metricsBlock = findUsageMetricsBlock(container);
    if (!metricsBlock) return;
    const cachedCard = findUsageMetricCard(metricsBlock, 'Cached Tokens');
    const totalCard = findUsageMetricCard(metricsBlock, 'Total Tokens');
    let latencyCard = findUsageMetricCard(metricsBlock, 'Avg Latency');
    if (!latencyCard) {
      latencyCard = document.createElement('div');
      latencyCard.className = cachedCard ? cachedCard.className : (totalCard ? totalCard.className : 'cliproxy-enhancer__card');
      if (cachedCard && cachedCard.parentElement) {
        cachedCard.insertAdjacentElement('afterend', latencyCard);
      } else if (totalCard && totalCard.parentElement) {
        totalCard.insertAdjacentElement('afterend', latencyCard);
      } else {
        metricsBlock.appendChild(latencyCard);
      }
    }
    const avgLatencyMs = Number(summary && summary.avg_latency_ms || 0);
    const signature = ['avg-latency-card', timeRange && timeRange.key || '', getUsageProviderFilter(), Math.round(avgLatencyMs)].join(':');
    setEnhancerMarkup(latencyCard, signature, `
      <div class="cliproxy-enhancer__label">Avg Latency</div>
      <div class="cliproxy-enhancer__value">${escapeHTML(formatDurationMs(avgLatencyMs))}</div>
      <div class="cliproxy-enhancer__hint">${escapeHTML(timeRange ? timeRange.label : 'Selected window')} average request completion time</div>
    `);
  }

  function hideUsageBlocks(container) {
    const linesBlock = findUsageChildBlock(container, 'Lines to display');
    if (linesBlock) {
      linesBlock.style.display = 'none';
      linesBlock.dataset.cliproxyHidden = 'true';
    }
    const serviceHealthBlock = findUsageChildBlock(container, 'Service Health');
    if (serviceHealthBlock) {
      serviceHealthBlock.style.display = 'none';
      serviceHealthBlock.dataset.cliproxyHidden = 'true';
    }
  }

  function hideUsageActionButtons(container) {
    const header = container && container.querySelector('h1') && container.querySelector('h1').parentElement;
    if (!(header instanceof HTMLElement)) return;
    Array.from(header.querySelectorAll('button')).forEach((button) => {
      const text = normalize(button.textContent);
      if (text !== 'Export' && text !== 'Import' && text !== 'Refresh') return;
      button.style.display = 'none';
      button.dataset.cliproxyHidden = 'true';
      button.setAttribute('aria-hidden', 'true');
    });
  }

  function findConfigSectionAnchor(container, title) {
    if (!(container instanceof HTMLElement)) return null;
    const needle = normalize(title).toLowerCase();
    const nodes = Array.from(container.querySelectorAll('.title, h2, h3, h4, label, span, div'));
    const titleNode = nodes.find((node) => normalize(node.textContent).toLowerCase() === needle)
      || nodes.find((node) => normalize(node.textContent).toLowerCase().includes(needle));
    if (!titleNode) return null;
    return titleNode.closest('.card, section, article, [class*="card"], [class*="section"]') || titleNode.parentElement;
  }

  function ensureOpenAICompatTogglePanel(container) {
    if (!(container instanceof HTMLElement)) return null;
    let panel = container.querySelector('#cliproxy-openai-compat-toggle-panel');
    if (!panel) {
      panel = document.createElement('section');
      panel.id = 'cliproxy-openai-compat-toggle-panel';
      panel.className = 'cliproxy-enhancer__config-panel';
    }
    const anchor = findConfigSectionAnchor(container, 'OpenAI Compatible Providers')
      || findConfigSectionAnchor(container, 'OpenAI compatible Providers');
    if (anchor instanceof HTMLElement && anchor.parentElement) {
      if (anchor.nextElementSibling !== panel) {
        anchor.insertAdjacentElement('afterend', panel);
      }
      return panel;
    }
    const header = container.querySelector('h1') && container.querySelector('h1').parentElement;
    if (header instanceof HTMLElement && header.parentElement && header.nextElementSibling !== panel) {
      header.insertAdjacentElement('afterend', panel);
      return panel;
    }
    if (!panel.isConnected) {
      container.insertBefore(panel, container.children[1] || null);
    }
    return panel;
  }

  function bindOpenAICompatTogglePanel(panel) {
    if (!(panel instanceof HTMLElement)) return;
    const inputs = Array.from(panel.querySelectorAll('input[data-cliproxy-compat-index]'));
    inputs.forEach((input) => {
      if (!(input instanceof HTMLInputElement) || input.dataset.cliproxyBound === 'true') return;
      input.dataset.cliproxyBound = 'true';
      input.addEventListener('change', async () => {
        const index = Number(input.dataset.cliproxyCompatIndex);
        const provider = openAICompatProviders[index];
        if (!provider || !provider.name) return;
        const previous = !input.checked;
        openAICompatSavingNames.add(provider.name);
        openAICompatProvidersError = '';
        renderOpenAICompatTogglePanel(getPageContainer());
        try {
          await patchOpenAICompatProviderConfig(provider.name, {
            'append-reasoning-effort-to-model': input.checked,
          });
          openAICompatProviders = openAICompatProviders.map((item, itemIndex) => itemIndex === index
            ? { ...item, 'append-reasoning-effort-to-model': input.checked }
            : item);
        } catch (error) {
          input.checked = previous;
          openAICompatProvidersError = `Failed to update ${provider.name}: ${error instanceof Error ? error.message : 'request failed'}`;
        } finally {
          openAICompatSavingNames.delete(provider.name);
          renderOpenAICompatTogglePanel(getPageContainer());
        }
      });
    });
    const percentInputs = Array.from(panel.querySelectorAll('input[data-cliproxy-compat-percent-index]'));
    percentInputs.forEach((input) => {
      if (!(input instanceof HTMLInputElement) || input.dataset.cliproxyPercentBound === 'true') return;
      input.dataset.cliproxyPercentBound = 'true';
      input.addEventListener('change', async () => {
        const index = Number(input.dataset.cliproxyCompatPercentIndex);
        const provider = openAICompatProviders[index];
        if (!provider || !provider.name) return;
        const previousValue = Number.isFinite(Number(provider['append-reasoning-effort-to-model-percent']))
          ? String(provider['append-reasoning-effort-to-model-percent'])
          : '100';
        const rawValue = input.value.trim();
        const normalizedValue = Math.max(0, Math.min(100, Number(rawValue || '100')));
        if (!Number.isFinite(normalizedValue)) {
          input.value = previousValue;
          return;
        }
        input.value = String(normalizedValue);
        openAICompatSavingNames.add(provider.name);
        openAICompatProvidersError = '';
        renderOpenAICompatTogglePanel(getPageContainer());
        try {
          await patchOpenAICompatProviderConfig(provider.name, {
            'append-reasoning-effort-to-model-percent': normalizedValue,
          });
          openAICompatProviders = openAICompatProviders.map((item, itemIndex) => itemIndex === index
            ? { ...item, 'append-reasoning-effort-to-model-percent': normalizedValue }
            : item);
        } catch (error) {
          input.value = previousValue;
          openAICompatProvidersError = `Failed to update ${provider.name}: ${error instanceof Error ? error.message : 'request failed'}`;
        } finally {
          openAICompatSavingNames.delete(provider.name);
          renderOpenAICompatTogglePanel(getPageContainer());
        }
      });
    });
  }

  function renderOpenAICompatTogglePanel(container) {
    if (!isAIProvidersConfigPageReady() || !(container instanceof HTMLElement)) return;
    const panel = ensureOpenAICompatTogglePanel(container);
    if (!(panel instanceof HTMLElement)) return;
    const providers = Array.isArray(openAICompatProviders) ? openAICompatProviders : [];
    const signature = [
      'openai-compat-toggle-panel',
      openAICompatProvidersLoading ? 'loading' : 'ready',
      openAICompatProvidersError,
      Array.from(openAICompatSavingNames).sort().join(','),
      providers.map((provider) => [
        normalize(provider && provider.name),
        provider && provider['append-reasoning-effort-to-model'] ? 'enabled' : 'disabled',
        Number.isFinite(Number(provider && provider['append-reasoning-effort-to-model-percent'])) ? Number(provider['append-reasoning-effort-to-model-percent']) : 'default',
        normalize(provider && provider['base-url']),
      ].join(':')).join('|'),
    ].join(':');
    const rows = providers.map((provider, index) => {
      const name = normalize(provider && provider.name) || `Provider ${index + 1}`;
      const baseURL = normalize(provider && provider['base-url']) || 'No base URL configured';
      const checked = !!(provider && provider['append-reasoning-effort-to-model']);
      const saving = openAICompatSavingNames.has(name);
      const percent = Number.isFinite(Number(provider && provider['append-reasoning-effort-to-model-percent']))
        ? Math.max(0, Math.min(100, Number(provider['append-reasoning-effort-to-model-percent'])))
        : 100;
      return `
        <div class="cliproxy-enhancer__config-provider-row">
          <div class="cliproxy-enhancer__config-provider-meta">
            <div class="cliproxy-enhancer__config-provider-name">${escapeHTML(name)}</div>
            <div class="cliproxy-enhancer__config-provider-url">${escapeHTML(baseURL)}</div>
          </div>
          <label class="cliproxy-enhancer__config-toggle">
            <input type="checkbox" data-cliproxy-compat-index="${index}" ${checked ? 'checked' : ''} ${saving ? 'disabled' : ''}>
            <span>Forward model ID as <code>&lt;model&gt;-&lt;reasoning_effort&gt;</code></span>
          </label>
          <label class="cliproxy-enhancer__config-toggle">
            <span>Apply to</span>
            <input type="number" min="0" max="100" step="1" inputmode="numeric" data-cliproxy-compat-percent-index="${index}" value="${percent}" ${saving ? 'disabled' : ''}>
            <span>% of matching requests</span>
          </label>
        </div>
      `;
    }).join('');
    const status = openAICompatProvidersError
      ? `<div class="cliproxy-enhancer__config-status" data-state="error">${escapeHTML(openAICompatProvidersError)}</div>`
      : `<div class="cliproxy-enhancer__config-status">${openAICompatProvidersLoading ? 'Loading OpenAI-compatible provider settings…' : 'Examples: gpt-5.4-high, gpt-5.3-codex-low. Set 100 for all requests, 0 to disable forwarding even when the toggle is on.'}</div>`;
    setEnhancerMarkup(panel, signature, `
      <div class="cliproxy-enhancer__label">OpenAI Compatible Providers</div>
      <div class="cliproxy-enhancer__hint">Per-provider control for forwarding the selected reasoning effort as part of the upstream model ID, with deterministic percentage-based sampling.</div>
      ${status}
      <div class="cliproxy-enhancer__config-provider-list">
        ${rows || '<div class="cliproxy-enhancer__muted">No OpenAI-compatible providers are configured.</div>'}
      </div>
    `);
    bindOpenAICompatTogglePanel(panel);
  }

  async function refreshOpenAICompatTogglePanel(force) {
    if (!isAIProvidersConfigPageReady()) return;
    if (openAICompatProvidersLoading) return;
    if (!force && openAICompatProviders.length > 0) {
      renderOpenAICompatTogglePanel(getPageContainer());
      return;
    }
    openAICompatProvidersLoading = true;
    openAICompatProvidersError = '';
    renderOpenAICompatTogglePanel(getPageContainer());
    try {
      openAICompatProviders = await fetchOpenAICompatProviders();
    } catch (error) {
      openAICompatProvidersError = `Failed to load OpenAI-compatible providers: ${error instanceof Error ? error.message : 'request failed'}`;
    } finally {
      openAICompatProvidersLoading = false;
      renderOpenAICompatTogglePanel(getPageContainer());
    }
  }

  function renderRequestEvents(container, stats, timeRange, usageSnapshot) {
    const requestBlock = findUsageChildBlock(container, 'Request Events');
    if (!requestBlock) return;
    requestBlock.style.display = 'none';
    let panel = container.querySelector('#cliproxy-request-events');
    if (!panel) {
      panel = document.createElement('div');
      panel.id = 'cliproxy-request-events';
      panel.className = 'cliproxy-enhancer__request-events cliproxy-request-events';
    }
    if (requestBlock.nextElementSibling !== panel) {
      requestBlock.insertAdjacentElement('afterend', panel);
    }
    const snapshotRequests = filterUsageSnapshotDetails(usageSnapshot, timeRange).map(({ apiKey, model, detail }) => {
      const tokens = detail && detail.tokens && typeof detail.tokens === 'object' ? detail.tokens : {};
      const anthropicCache = detail && detail.anthropic_cache && typeof detail.anthropic_cache === 'object' ? detail.anthropic_cache : {};
      const anthropicCacheRead = Number(anthropicCache.anthropic_cache_read_input_tokens || 0);
      const anthropicCacheWrite = Number(anthropicCache.anthropic_cache_creation_input_tokens || 0);
      const rawInput = Number(tokens.input_tokens || 0);
      const effectiveInput = anthropicCacheRead > 0 || anthropicCacheWrite > 0
        ? rawInput + anthropicCacheRead + anthropicCacheWrite
        : rawInput;
      return {
        id: `${apiKey}:${model}:${detail && detail.timestamp || ''}`,
        timestamp: detail && detail.timestamp,
        model,
        apiKey,
        latency_ms: Number(detail && detail.latency_ms || 0),
        customer_id: detail && detail.customer_id || '',
        customer_email: detail && detail.customer_email || '',
        reasoning_effort: 'n/a',
        anthropic_rewrite_applied: !!anthropicCache.rewrite_applied,
        anthropic_cache_ttl: anthropicCache.ttl || '',
        anthropic_breakpoints: [
          anthropicCache.tools_breakpoint ? 'tools' : '',
          anthropicCache.system_breakpoint ? 'system' : '',
          anthropicCache.messages_breakpoint ? 'messages' : '',
        ].filter(Boolean).join(', '),
        anthropic_overwrote_client_layout: !!anthropicCache.overwrote_client_layout,
        anthropic_matched_agentic_loop: !!anthropicCache.matched_agentic_coding_loop,
        anthropic_cache_read_input_tokens: anthropicCacheRead,
        anthropic_cache_creation_input_tokens: anthropicCacheWrite,
        input_tokens: rawInput,
        effective_input_tokens: effectiveInput,
        output_tokens: Number(tokens.output_tokens || 0),
        reasoning_tokens: Number(tokens.reasoning_tokens || 0),
        cached_tokens: Number(tokens.cached_tokens || 0),
      };
    });
    const requests = (snapshotRequests.length ? snapshotRequests : filterRecentRequests(stats && stats.recent_requests || [], timeRange))
      .sort((left, right) => new Date(right && right.timestamp || 0).getTime() - new Date(left && left.timestamp || 0).getTime())
      .slice(0, MAX_REQUEST_ROWS);
    const signature = ['request-events', timeRange.key, getUsageProviderFilter(), requests.map((item) => `${item.id || ''}:${item.timestamp || ''}:${item.apiKey || ''}:${item.model || ''}:${item.output_tokens || 0}:${item.customer_email || ''}`).join('|')].join(':');
    setEnhancerMarkup(panel, signature, `
      <div class="cliproxy-enhancer__label">Request Events</div>
      <div class="cliproxy-enhancer__hint">Latest ${MAX_REQUEST_ROWS} filtered request events within ${escapeHTML(timeRange.label)}.</div>
      <div class="cliproxy-enhancer__table-wrap">
        <table class="cliproxy-enhancer__table">
          <thead>
            <tr>
              <th>Timestamp</th>
              <th>Time</th>
              <th>User</th>
              <th>Model Name</th>
              <th>Reasoning Effort</th>
              <th>Cache Policy</th>
              <th>Input Tokens (effective)</th>
              <th>Output Tokens</th>
              <th>Reasoning Tokens</th>
              <th>Cache Read</th>
              <th>Cache Write</th>
            </tr>
          </thead>
          <tbody>
            ${requests.length ? requests.map((item) => {
              const policy = item.anthropic_rewrite_applied
                ? [
                    item.anthropic_cache_ttl || 'n/a',
                    item.anthropic_breakpoints || 'none',
                    item.anthropic_overwrote_client_layout ? 'overwrite' : 'preserve',
                    item.anthropic_matched_agentic_loop ? 'agentic' : 'general',
                  ].join(' · ')
                : 'n/a';
              const anthropicCacheRead = Number(item.anthropic_cache_read_input_tokens || 0);
              const anthropicCacheWrite = Number(item.anthropic_cache_creation_input_tokens || 0);
              const isAnthropicRow = item.anthropic_rewrite_applied || anthropicCacheRead > 0 || anthropicCacheWrite > 0;
              const cacheRead = isAnthropicRow ? anthropicCacheRead : Number(item.cached_tokens || 0);
              const cacheWrite = isAnthropicRow ? anthropicCacheWrite : 0;
              const rawInput = Number(item.input_tokens || 0);
              const effectiveInput = isAnthropicRow
                ? Number(item.effective_input_tokens || 0) || (rawInput + cacheRead + cacheWrite)
                : rawInput;
              const inputLabel = isAnthropicRow && effectiveInput !== rawInput
                ? `${formatInteger(effectiveInput)} (uncached ${formatInteger(rawInput)})`
                : formatInteger(effectiveInput);
              const userLabel = normalize(item.customer_email || item.customer_id) || 'Admin';
              return `
              <tr>
                <td>${escapeHTML(formatDateTime(item.timestamp))}</td>
                <td>${escapeHTML(formatDurationMs(item.latency_ms))}</td>
                <td>${escapeHTML(userLabel)}</td>
                <td>${escapeHTML(item.model || '')}</td>
                <td>${escapeHTML(item.reasoning_effort || 'n/a')}</td>
                <td>${escapeHTML(policy)}</td>
                <td>${escapeHTML(inputLabel)}</td>
                <td>${escapeHTML(formatInteger(item.output_tokens))}</td>
                <td>${escapeHTML(formatInteger(item.reasoning_tokens))}</td>
                <td>${escapeHTML(formatInteger(cacheRead))}</td>
                <td>${escapeHTML(formatInteger(cacheWrite))}</td>
              </tr>
            `; }).join('') : `
              <tr>
                <td colspan="11" class="cliproxy-enhancer__muted">No request events for the selected window.</td>
              </tr>
            `}
          </tbody>
        </table>
      </div>
    `);
  }

  function renderUsageStatistics(container, stats, timeRange) {
    const cacheStats = getCacheStatisticsRenderSnapshot(stats);
    const usageSnapshot = getUsageRenderSnapshot(stats);
    updateServiceHealthRow(ensureServiceHealthRow(container), cacheStats.summary || {}, timeRange.label);
    patchUsageSummaryCards(container, cacheStats || {}, timeRange);
    patchCachedTokensCard(container, cacheStats.summary || {}, timeRange);
    patchAverageLatencyCard(container, cacheStats.summary || {}, timeRange);
    renderUsageTrendCharts(container, cacheStats || {});
    renderCredentialStatistics(container, usageSnapshot, timeRange);
    renderModelStatistics(container, usageSnapshot, timeRange);
    renderRequestEvents(container, cacheStats, timeRange, usageSnapshot);
  }

  function scheduleUsageRefreshRetry(delayMs) {
    if (usageRefreshRetryTimer) return;
    usageRefreshRetryTimer = window.setTimeout(() => {
      usageRefreshRetryTimer = null;
      if (!isUsagePageReady() || document.hidden) return;
      refreshUsagePage(true).catch(() => {});
    }, Math.max(0, delayMs));
  }

  async function refreshUsagePage(background) {
    if (usageRefreshInFlight || !isUsagePageReady()) return;
    usageRefreshInFlight = true;
    try {
      const container = getPageContainer();
      if (!container) return;
      scheduleChartAnimationDisable();
      hideUsageActionButtons(container);
      ensureUsageControls(container);
      applyUsageChartPeriodDefaults(container);
      hideUsageBlocks(container);
      const timeRange = getUsageTimeRange();
      const minIntervalMs = getUsageIntervalSeconds() * 1000;
      const elapsedMs = Date.now() - lastUsageStatisticsFetchAt;
      const sameRange = lastUsageStatisticsRangeKey === timeRange.key;
      const sameFilter = lastUsageStatisticsProvider === getUsageProviderFilter();
      const remainingMs = lastUsageStatisticsFetchAt > 0 && sameRange && sameFilter ? Math.max(0, minIntervalMs - elapsedMs) : 0;
      if (remainingMs > 0) {
        if (lastUsageStatistics && sameRange && sameFilter) {
          renderUsageStatistics(container, lastUsageStatistics, timeRange);
        }
        disableChartAnimations(container);
        scheduleUsageRefreshRetry(remainingMs);
        return;
      }
      const stats = await fetchCacheStatistics(timeRange, RECENT_REQUEST_FETCH_LIMIT);
      if (!stats) return;
      lastUsageStatisticsFetchAt = Date.now();
      lastUsageStatistics = stats;
      lastUsageStatisticsRangeKey = timeRange.key;
      lastUsageStatisticsProvider = getUsageProviderFilter();
      renderUsageStatistics(container, stats, timeRange);
      disableChartAnimations(container);
    } finally {
      usageRefreshInFlight = false;
    }
  }

  function findFiberFromElement(element) {
    if (!element) return null;
    const key = Object.keys(element).find((entry) => entry.startsWith('__reactFiber$'));
    return key ? element[key] : null;
  }

  function findFiberByName(element, name) {
    let fiber = findFiberFromElement(element);
    while (fiber) {
      const fiberName = fiber.elementType && fiber.elementType.name || fiber.type && fiber.type.name || fiber.type;
      if (fiberName === name) return fiber;
      fiber = fiber.return;
    }
    return null;
  }

  function getQuotaFiberState(element) {
    const fiber = findFiberByName(element, 'cf');
    if (!fiber) return null;
    let hook = fiber.memoizedState;
    let viewModeDispatch = null;
    let warningDispatch = null;
    let currentPageDispatch = null;
    let pageSizeDispatch = null;
    let currentPage = null;
    let pageSize = null;
    while (hook) {
      const value = hook.memoizedState;
      const dispatch = hook.queue && hook.queue.dispatch;
      if (!viewModeDispatch && value === 'paged' && dispatch) {
        viewModeDispatch = dispatch;
      } else if (viewModeDispatch && !warningDispatch && typeof value === 'boolean' && dispatch) {
        warningDispatch = dispatch;
      } else if (viewModeDispatch && warningDispatch && !currentPageDispatch && typeof value === 'number' && dispatch) {
        currentPage = value;
        currentPageDispatch = dispatch;
      } else if (currentPageDispatch && !pageSizeDispatch && typeof value === 'number' && dispatch) {
        pageSize = value;
        pageSizeDispatch = dispatch;
        break;
      }
      hook = hook.next;
    }
    return {
      fiber,
      viewModeDispatch,
      warningDispatch,
      currentPage,
      currentPageDispatch,
      pageSize,
      pageSizeDispatch,
    };
  }

  function getQuotaSectionContexts(container) {
    return Array.from(container.querySelectorAll('.card')).map((card, index) => {
      const refreshButton = Array.from(card.querySelectorAll('button')).find((button) => normalize(button.textContent) === 'Refresh all credentials');
      if (!refreshButton) return null;
      const state = getQuotaFiberState(refreshButton);
      if (!state) return null;
      const props = state.fiber.memoizedProps || {};
      let count = 0;
      try {
        if (Array.isArray(props.files) && props.config && typeof props.config.filterFn === 'function') {
          count = props.files.filter(props.config.filterFn).length;
        }
      } catch {}
      if (!count) {
        const badge = card.querySelector('.QuotaPage-module__countBadge___tuPLs');
        count = Number(badge ? badge.textContent : 0) || 0;
      }
      const key = props.config && props.config.i18nPrefix ? String(props.config.i18nPrefix) : `quota-${index}`;
      return { key, card, refreshButton, count, state };
    }).filter(Boolean);
  }

  function applyQuotaMode(context, mode, options) {
    const settings = options || {};
    const storedPageSize = getQuotaPageSize();
    const nextPageSize = mode === 'all' ? Math.max(context.count, 1) : storedPageSize;
    const shouldUpdatePageSize = context.state.pageSize !== nextPageSize;
    quotaModes.set(context.key, mode);
    if (context.state.viewModeDispatch) context.state.viewModeDispatch('paged');
    if (context.state.warningDispatch) context.state.warningDispatch(false);
    if (settings.resetPage !== false && context.state.currentPageDispatch) context.state.currentPageDispatch(1);
    if (shouldUpdatePageSize && context.state.pageSizeDispatch) context.state.pageSizeDispatch(nextPageSize);
  }

  function hideQuotaWarnings() {
    Array.from(document.querySelectorAll('.QuotaPage-module__warningOverlay___lVjB7, .QuotaPage-module__warningModal___2pPNd')).forEach((node) => {
      node.classList.add('cliproxy-enhancer__warning-hidden');
      node.setAttribute('aria-hidden', 'true');
      node.style.display = 'none';
    });
    const container = getPageContainer();
    if (!container) return;
    getQuotaSectionContexts(container).forEach((context) => {
      if (context.state.warningDispatch) context.state.warningDispatch(false);
    });
  }

  function ensureQuotaControls(container) {
    const header = container.querySelector('h1') && container.querySelector('h1').parentElement;
    if (!header || !header.parentElement) return null;
    let controls = container.querySelector('#cliproxy-quota-controls');
    if (!controls) {
      controls = document.createElement('div');
      controls.id = 'cliproxy-quota-controls';
      controls.className = 'cliproxy-enhancer__toolbar';
      controls.innerHTML = `
        <label>
          <input id="cliproxy-quota-auto-refresh-toggle" type="checkbox">
          Quota auto refresh
        </label>
        <label>
          Every
          <input id="cliproxy-quota-auto-refresh-interval" type="number" min="1" max="300" step="1">
          sec
        </label>
        <label>
          Paged view size
          <input id="cliproxy-quota-page-size" type="number" min="1" max="1000" step="1">
        </label>
      `;
      header.insertAdjacentElement('afterend', controls);
      const autoToggle = controls.querySelector('#cliproxy-quota-auto-refresh-toggle');
      const interval = controls.querySelector('#cliproxy-quota-auto-refresh-interval');
      const pageSize = controls.querySelector('#cliproxy-quota-page-size');
      autoToggle.addEventListener('change', () => {
        setJSONStorage(STORAGE_KEYS.quotaAuto, autoToggle.checked);
        startQuotaTimer();
      });
      interval.addEventListener('change', () => {
        const next = Math.min(300, Math.max(1, Math.round(Number(interval.value) || DEFAULT_QUOTA_INTERVAL)));
        interval.value = String(next);
        setJSONStorage(STORAGE_KEYS.quotaInterval, next);
        startQuotaTimer();
      });
      pageSize.addEventListener('change', () => {
        const next = Math.min(1000, Math.max(1, Math.round(Number(pageSize.value) || DEFAULT_QUOTA_PAGE_SIZE)));
        pageSize.value = String(next);
        setJSONStorage(STORAGE_KEYS.quotaPageSize, next);
        const contexts = getQuotaSectionContexts(container);
        contexts.forEach((context) => {
          if ((quotaModes.get(context.key) || 'paged') !== 'all') {
            applyQuotaMode(context, 'paged');
          }
        });
      });
    }
    controls.querySelector('#cliproxy-quota-auto-refresh-toggle').checked = getQuotaAutoEnabled();
    controls.querySelector('#cliproxy-quota-auto-refresh-interval').value = String(getQuotaIntervalSeconds());
    controls.querySelector('#cliproxy-quota-page-size').value = String(getQuotaPageSize());
    return controls;
  }

  function installQuotaClickInterceptor() {
    if (quotaClickInterceptorInstalled) return;
    quotaClickInterceptorInstalled = true;
    document.addEventListener('click', (event) => {
      if (!isQuotaPageReady()) return;
      const button = event.target && event.target.closest ? event.target.closest('button') : null;
      if (!button) return;
      const text = normalize(button.textContent);
      if (text !== 'Show all' && text !== 'Paged' && text !== 'Confirm') return;
      const container = getPageContainer();
      if (!container) return;
      if (text === 'Confirm') {
        event.preventDefault();
        event.stopPropagation();
        if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        hideQuotaWarnings();
        return;
      }
      const card = button.closest('.card');
      if (!card) return;
      const context = getQuotaSectionContexts(container).find((item) => item.card === card);
      if (!context) return;
      event.preventDefault();
      event.stopPropagation();
      if (event.stopImmediatePropagation) event.stopImmediatePropagation();
      applyQuotaMode(context, text === 'Show all' ? 'all' : 'paged');
      hideQuotaWarnings();
    }, true);
  }


  async function fetchAntigravityCredits() {
    if (antigravityCreditFetchInFlight) return;
    const now = Date.now();
    if (now - antigravityCreditLastFetchAt < ANTIGRAVITY_CREDIT_CACHE_TTL && antigravityCreditCache.size > 0) return;
    antigravityCreditFetchInFlight = true;
    try {
      const ready = await ensureManagementAuth();
      if (!ready || !nativeFetch || !managementAuthorization) return;
      const listResp = await nativeFetch('/v0/management/auth-files', {
        headers: { Authorization: managementAuthorization },
      });
      if (!listResp.ok) return;
      const listData = await listResp.json();
      const files = (listData.files || []).filter(f => f.name && f.name.startsWith('antigravity-'));
      if (!files.length) return;
      const fetches = files.map(async (f) => {
        try {
          const dlResp = await nativeFetch('/v0/management/auth-files/download?name=' + encodeURIComponent(f.name), {
            headers: { Authorization: managementAuthorization },
          });
          if (!dlResp.ok) return;
          const dlData = await dlResp.json();
          const quotaRaw = dlData.quota_usage;
          const quotaUsage = (() => {
            if (!quotaRaw) return {};
            if (typeof quotaRaw === 'string') { try { return JSON.parse(quotaRaw); } catch { return {}; } }
            return quotaRaw;
          })();
          const tierName = (quotaUsage.paidTier && quotaUsage.paidTier.name) || dlData.antigravity_paid_tier_id || '';
          const userCredits = quotaUsage.userCredits || {};
          const creditEntries = Object.values(userCredits);
          const hasCredits = creditEntries.length > 0;
          const creditAmount = hasCredits ? creditEntries.reduce((s, c) => s + (parseFloat(c.amount) || 0), 0) : 0;
          const minCredit = hasCredits ? creditEntries.reduce((s, c) => s + (parseFloat(c.minAmountForUsage) || 0), 0) : 0;
          const available = !hasCredits || creditAmount > minCredit;
          const creditType = hasCredits ? (creditEntries[0].creditType || '') : '';
          const modelsQuota = dlData.antigravity_models_quota || null;
          const modelsQuotaMinRemaining = typeof dlData.antigravity_models_quota_min_remaining === 'number' ? dlData.antigravity_models_quota_min_remaining : null;
          const modelsQuotaCheckedAt = dlData.antigravity_models_quota_checked_at || '';
          antigravityCreditCache.set(f.name, { tierName, creditAmount, minCredit, available, creditType, hasCredits, modelsQuota, modelsQuotaMinRemaining, modelsQuotaCheckedAt });
        } catch {}
      });
      await Promise.all(fetches);
      antigravityCreditLastFetchAt = Date.now();
    } finally {
      antigravityCreditFetchInFlight = false;
    }
  }

  function buildCreditBadge(credit) {
    if (!credit) return '<span class="cliproxy-credit-badge cliproxy-credit-badge--unknown">Unknown</span>';
    const tier = escapeHTML(credit.tierName || 'Unknown Tier');
    if (!credit.hasCredits) {
      return '<span class="cliproxy-credit-badge cliproxy-credit-badge--unlimited">' + tier + ' &middot; Unlimited</span>';
    }
    const amt = credit.creditAmount.toFixed(2);
    const pct = credit.minCredit > 0 ? Math.round((credit.creditAmount / (credit.creditAmount + credit.minCredit)) * 100) : (credit.creditAmount > 0 ? 100 : 0);
    const cls = credit.available ? 'cliproxy-credit-badge--available' : 'cliproxy-credit-badge--exhausted';
    const label = credit.available ? 'Available' : 'Exhausted';
    return '<span class="cliproxy-credit-badge ' + cls + '">' + tier + ' &middot; Credits: ' + amt + ' (' + pct + '%) &middot; ' + label + '</span>';
  }

  function buildQuotaSummaryBadge(credit) {
    if (!credit || !credit.modelsQuota || credit.modelsQuotaMinRemaining === null) return '';
    const pct = Math.round(credit.modelsQuotaMinRemaining * 100);
    const cls = pct > 50 ? 'good' : pct > 20 ? 'warn' : 'low';
    return '<span class="cliproxy-quota-summary cliproxy-quota-summary--' + cls + '" onclick="var m=this.parentElement.querySelector(\'.cliproxy-quota-models\');if(m)m.classList.toggle(\'cliproxy-quota-models--open\')" title="Click for per-model breakdown">Quota: ' + pct + '%</span>';
  }

  function formatQuotaResetTime(isoStr) {
    try {
      var d = new Date(isoStr);
      var now = new Date();
      var diff = d - now;
      if (diff <= 0) return 'reset';
      if (diff < 3600000) return Math.ceil(diff / 60000) + 'm';
      if (diff < 86400000) return Math.round(diff / 3600000) + 'h';
      return Math.round(diff / 86400000) + 'd';
    } catch (e) { return ''; }
  }

  function buildModelQuotaSection(credit) {
    if (!credit || !credit.modelsQuota) return '';
    var entries = Object.entries(credit.modelsQuota);
    entries.sort(function(a, b) { return (a[1].remainingFraction || 0) - (b[1].remainingFraction || 0); });
    if (!entries.length) return '';
    var html = '<div class="cliproxy-quota-models">';
    for (var i = 0; i < entries.length; i++) {
      var modelId = entries[i][0];
      var info = entries[i][1];
      var pct = Math.round((info.remainingFraction || 0) * 100);
      var cls = pct > 50 ? 'good' : pct > 20 ? 'warn' : 'low';
      var label = escapeHTML(info.displayName || modelId);
      var resetStr = info.resetTime ? formatQuotaResetTime(info.resetTime) : '';
      html += '<div class="cliproxy-quota-model-row">'
        + '<span class="cliproxy-quota-model-label" title="' + escapeHTML(modelId) + '">' + label + '</span>'
        + '<div class="cliproxy-quota-bar"><div class="cliproxy-quota-bar-fill cliproxy-quota-bar-fill--' + cls + '" style="width:' + pct + '%"></div></div>'
        + '<span class="cliproxy-quota-model-pct">' + pct + '%</span>'
        + (resetStr ? '<span class="cliproxy-quota-reset">' + escapeHTML(resetStr) + '</span>' : '')
        + '</div>';
    }
    html += '</div>';
    return html;
  }

  function injectAntigravityCreditBadges(container) {
    if (antigravityCreditCache.size === 0) return;
    const cards = container.querySelectorAll('.card');
    let agCard = null;
    cards.forEach(card => {
      const text = card.textContent || '';
      if (text.includes('Antigravity Quota')) agCard = card;
    });
    if (!agCard) return;
    const allDivs = agCard.querySelectorAll('div');
    allDivs.forEach(div => {
      const text = div.textContent || '';
      if (!text.includes('antigravity-') || !text.includes('.json')) return;
      for (const [key, credit] of antigravityCreditCache) {
        if (text.includes(key)) {
          if (div.parentElement && !div.parentElement.querySelector('.cliproxy-credit-row')) {
            const row = document.createElement('div');
            row.className = 'cliproxy-credit-row';
            row.innerHTML = buildCreditBadge(credit) + buildQuotaSummaryBadge(credit) + buildModelQuotaSection(credit);
            div.parentElement.appendChild(row);
          }
          break;
        }
      }
    });
  }

  async function refreshQuotaPage(background) {
    if (quotaRefreshInFlight || !isQuotaPageReady()) return;
    quotaRefreshInFlight = true;
    try {
      const container = getPageContainer();
      if (!container) return;
      ensureQuotaControls(container);
      installQuotaClickInterceptor();
      hideQuotaWarnings();
      const contexts = getQuotaSectionContexts(container);
      contexts.forEach((context) => {
        const mode = quotaModes.get(context.key) || 'paged';
        applyQuotaMode(context, mode, { resetPage: false });
      });
      fetchAntigravityCredits().then(() => {
        const c = getPageContainer();
        if (c) injectAntigravityCreditBadges(c);
      }).catch(() => {});
    } finally {
      quotaRefreshInFlight = false;
    }
  }

  function stopUsageTimer() {
    if (usageTimer) {
      window.clearInterval(usageTimer);
      usageTimer = null;
    }
    if (usageRefreshRetryTimer) {
      window.clearTimeout(usageRefreshRetryTimer);
      usageRefreshRetryTimer = null;
    }
    if (nativeUsageRefreshRetryTimer) {
      window.clearTimeout(nativeUsageRefreshRetryTimer);
      nativeUsageRefreshRetryTimer = null;
    }
  }

  function stopQuotaTimer() {
    if (quotaTimer) {
      window.clearInterval(quotaTimer);
      quotaTimer = null;
    }
  }

  function startUsageTimer() {
    stopUsageTimer();
    if (!getUsageAutoEnabled()) return;
    usageTimer = window.setInterval(() => {
      if (!isUsagePageReady() || document.hidden) return;
      triggerNativeUsageRefresh(true);
      refreshUsagePage(true).catch(() => {});
    }, getUsageIntervalSeconds() * 1000);
  }

  function startQuotaTimer() {
    stopQuotaTimer();
    if (!getQuotaAutoEnabled()) return;
    quotaTimer = window.setInterval(() => {
      if (!isQuotaPageReady() || document.hidden) return;
      triggerQuotaRefreshAll();
      refreshQuotaPage(true).catch(() => {});
    }, getQuotaIntervalSeconds() * 1000);
  }

  function isEnhancerManagedNode(node) {
    let current = node && node.nodeType === 3 ? node.parentElement : node;
    while (current && current !== document.body) {
      const id = typeof current.id === 'string' ? current.id : '';
      const className = typeof current.className === 'string' ? current.className : '';
      if (id.startsWith('cliproxy-') || className.includes('cliproxy-')) {
        return true;
      }
      current = current.parentElement;
    }
    return false;
  }

  function shouldIgnoreRouteSyncMutations(mutations) {
    return mutations.every((mutation) => {
      if (!isEnhancerManagedNode(mutation.target)) return false;
      const addedNodes = Array.from(mutation.addedNodes || []);
      if (addedNodes.some((node) => !isEnhancerManagedNode(node))) return false;
      const removedNodes = Array.from(mutation.removedNodes || []);
      if (removedNodes.some((node) => !isEnhancerManagedNode(node))) return false;
      return true;
    });
  }

  function findDefaultCollapsedSectionToggle(container, title) {
    if (!(container instanceof HTMLElement)) return null;
    const needle = normalize(title);
    const toggles = Array.from(container.querySelectorAll('button, [role="button"], summary'));
    const directMatch = toggles.find((node) => normalize(node.textContent) === needle)
      || toggles.find((node) => normalize(node.textContent).includes(needle));
    if (directMatch) return directMatch;
    const titleNode = Array.from(container.querySelectorAll('.title, h2, h3, h4, span, div')).find((node) => {
      const text = normalize(node.textContent);
      return text === needle || text.includes(needle);
    });
    return titleNode && titleNode.closest
      ? (titleNode.closest('button, [role="button"], summary') || null)
      : null;
  }

  function collapseDefaultSections(container) {
    if (!(container instanceof HTMLElement)) return;
    const routeKey = currentRouteKey();
    DEFAULT_COLLAPSED_SECTION_TITLES.forEach((title) => {
      const stateKey = `${routeKey}:${title}`;
      if (collapsedSectionKeys.has(stateKey)) return;
      const toggle = findDefaultCollapsedSectionToggle(container, title);
      if (!toggle) return;
      const expanded = normalize(toggle.getAttribute('aria-expanded'));
      if (expanded && expanded !== 'true') {
        collapsedSectionKeys.add(stateKey);
        return;
      }
      toggle.click();
      collapsedSectionKeys.add(stateKey);
    });
  }

  function syncRouteSoon() {
    if (routeSyncTimer) return;
    routeSyncTimer = window.setTimeout(() => {
      routeSyncTimer = null;
      scheduleChartAnimationDisable();
      if (window.location.hash === '#cache-statistics') {
        history.replaceState(null, '', `${window.location.pathname}${window.location.search}#/usage`);
      }
      const container = getPageContainer();
      collapseDefaultSections(container);
      if (isUsagePageReady()) {
        stopQuotaTimer();
        scheduleUsageFilterSync(lastObservedUsageFilterKey ? 150 : 0, { force: !lastObservedUsageFilterKey });
        startUsageTimer();
        return;
      }
      if (isQuotaPageReady()) {
        stopUsageTimer();
        clearUsageFilterSyncTimer();
        usageChartDefaultsApplied = false;
        lastObservedUsageFilterKey = '';
        refreshQuotaPage(false).catch(() => {});
        startQuotaTimer();
        return;
      }
      if (isAIProvidersConfigPageReady()) {
        stopUsageTimer();
        stopQuotaTimer();
        clearUsageFilterSyncTimer();
        usageChartDefaultsApplied = false;
        lastObservedUsageFilterKey = '';
        refreshOpenAICompatTogglePanel(false).catch(() => {});
        return;
      }
      stopUsageTimer();
      stopQuotaTimer();
      clearUsageFilterSyncTimer();
      usageChartDefaultsApplied = false;
      lastObservedUsageFilterKey = '';
    }, 50);
  }

  installStyles();
  captureManagementAuthFromLoginPage();
  patchFetch();
  patchXHR();
  installUsageChartPeriodInterceptor();
  startChartAnimationGuard();
  window.addEventListener('hashchange', syncRouteSoon);
  new MutationObserver((mutations) => {
    if (shouldIgnoreRouteSyncMutations(mutations)) return;
    syncRouteSoon();
  }).observe(document.body, { childList: true, subtree: true });
  syncRouteSoon();
})();
